server_name: srv1

jetstream {
  store_dir: './data'
  max_mem_store: 1Gb
  max_file_store: 5Gb
}

# Authorization
authorization {
  users = [
    { 
      user: "api",
      password: "apiPass",
      permissions = { 
        publish = ["webhooks.>"],
        subscribe = [] 
      } 
    }
    {
      user: "worker",
      password: "workerPass",
      permissions = {
        publish = [],
        subscribe = ["webhooks.>", "_INBOX.>"]
      }
    }
    { 
      user: "admin",  
      password: "adminPass",  
      permissions = { 
        publish = ">", 
        subscribe = ">" 
      }
    }
  ]
}

