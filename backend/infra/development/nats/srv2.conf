server_name: srv2

jetstream {
  store_dir: '/home/nx2io/data'
  max_mem_store: 1Gb
  max_file_store: 5Gb
}

permissions {
  api_perms = {
    publish = ["events.>"]
    subscribe = []
  }
  worker_perms = {
    publish = []
    subscribe = ["events.>"]
  }
  admin_perms = {
    publish = ">"
    subscribe = ">"
  }
}

# Authorization
authorization {
  users = [
    { 
      user: "api",
      password: "apiPass",
      permissions = { 
        publish = ["events.>"],
        subscribe = [] 
      } 
    }
    {
      user: "worker",
      password: "workerPass",
      permissions = {
        publish = [],
        subscribe = ["events.>", "_INBOX.>"]
      }
    }
    { 
      user: "admin",  
      password: "adminPass",  
      permissions = { 
        publish = ">", 
        subscribe = ">" 
      }
    }
  ]
}

cluster {
  name: js-cluster
  listen: 0.0.0.0:6222
  routes = [
    nats://srv1:6222
    nats://srv3:6222
  ]
}

http: 0.0.0.0:8222
