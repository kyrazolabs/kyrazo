# =========================
# NATS SERVER (nats-1)
# =========================
server_name: "nats-1"
port: 4222
http_port: 8222

# ---------- JetStream ----------
jetstream {
  store_dir: "/data"
  max_mem_store: 2Gb
  max_file_store: 10Gb
  domain: "jetstream"
}

# ---------- TLS (Clients) ----------
tls {
  cert_file: "/etc/nats/certs/nats-3.pem"
  key_file:  "/etc/nats/certs/nats-3.key"
  ca_file:   "/etc/nats/certs/ca.pem"
  verify: true
  timeout: 2
}

# ---------- Auth ----------
authorization {
  users = [
    {
      user: admin,
      password: "$2a$11$Woz2TROJos4gPkwtCvLpauwP4GbS14JkPKHHezjNwF8bJMsohUsJC",
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: producer,
      password: "$2a$11$bjp7J5/snezGofRiKZHvmuFVN1MRKqlinw4fQEcJssK8s1TOg2Lce",
      permissions: { publish: ["workspace.>", "$JS.>"], subscribe: "_INBOX.>" }
    },
    {
      user: worker,
      password: "$2a$11$/QxJI7OQaDppUvIB8Dhs9eE9nS/A/PiDcH/FVL5Tgt6ooHxiSyEX2",
      permissions: { subscribe: ["workspace.>"], publish: "_INBOX.>" }
    }
  ]
}

# ---------- Cluster ----------
cluster {
  name: "nats-cluster"
  listen: "0.0.0.0:6222"

  tls {
    cert_file: "/etc/nats/certs/nats-3.pem"
    key_file:  "/etc/nats/certs/nats-3.key"
    ca_file:   "/etc/nats/certs/ca.pem"
    verify: true
  }

  routes = [
    "nats://10.8.0.4:6222"
  ]
}
