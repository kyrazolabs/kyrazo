# ================================
# Storage
# ================================
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.5        # اضبطها ~50% من RAM المتاح
    collectionConfig:
      blockCompressor: zstd
    indexConfig:
      prefixCompression: true

# ================================
# System Log
# ================================
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  verbosity: 0

# ================================
# Network
# ================================
net:
  port: 27017
  bindIp: 127.0.0.1,159.195.70.162       # ❗ لا تفتح MongoDB على الإنترنت
  maxIncomingConnections: 65536
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/mongo/tls/server.pem
    CAFile: /etc/mongo/tls/ca.crt
    allowConnectionsWithoutCertificates: false



# ================================
# Process Management
# ================================
processManagement:
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo

# ================================
# Security
# ================================
security:
  authorization: enabled  # ❗ إلزامي
  keyFile: /etc/mongodb/keyfile   # فقط لو Replica Set


# ================================
# Replication (اختياري الآن – مهم لاحقًا)
# ================================
# replication:
#   replSetName: rs0

# ================================
# Operation Profiling
# ================================
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200


# ================================
# Set Parameters
# ================================
setParameter:
  enableLocalhostAuthBypass: false

