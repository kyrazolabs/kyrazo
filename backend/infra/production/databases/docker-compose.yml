services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./mongo/mongod.conf:/etc/mongo/mongod.conf:ro
      - ./mongo/tls:/etc/mongo/tls
      - ./mongo/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - kyrazo-net
    entrypoint: ["sh", "/entrypoint.sh"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '1.5'
          memory: 3G

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - ./redis/tls:/usr/local/etc/redis/tls
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - kyrazo-net
    entrypoint: ["sh", "/entrypoint.sh"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 1G


  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    ports:
      # - "8123:8123"
      # - "9000:9000"
      - "8443:8443"
      - "9440:9440"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./clickhouse/certificates:/etc/clickhouse-server/certificates
      - ./clickhouse/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://localhost:8443/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    entrypoint: ["sh", "/entrypoint.sh"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CH_USER: ${CH_USER}
      CH_PASS_HASH: ${CH_PASS_HASH}
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G
        reservations:
          cpus: '4'
          memory: 10G

networks:
  kyrazo-net:
    driver: bridge
    name: kyrazo-net

volumes:
  mongo_data:
  redis_data:
  clickhouse_data:
