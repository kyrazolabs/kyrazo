services:
  # Message Broker
  nats:
    image: nats:latest
    container_name: kyrazo-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./configs/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - kyrazo-net

  # API Services
  dashboard-api:
    build:
      context: ../../../
      dockerfile: apis/dashboard/Dockerfile
    container_name: dashboard-api
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  ingest-api:
    build:
      context: ../../../
      dockerfile: apis/ingest/Dockerfile
    container_name: ingest-api
    restart: unless-stopped
    ports:
      - 9100:9000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=9000
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1.5'
          memory: 2G

  integration-api:
    build:
      context: ../../../
      dockerfile: apis/integration/Dockerfile
    container_name: integration-api
    restart: unless-stopped
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1.5'
          memory: 2G

  scheduler-api:
    build:
      context: ../../../
      dockerfile: apis/scheduler/Dockerfile
    container_name: scheduler-api
    restart: unless-stopped
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1.5'
          memory: 2G

  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx.conf.d/default.conf:ro
      - webroot:/var/www/html
    depends_on:
      - dashboard-api
      - ingest-api
      - integration-api
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - cert-var:/var/lib/letsencrypt
      - webroot:/var/www/html
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/html --email support@kyrazo.com --agree-tos --no-eff-email --non-interactive --keep-until-expiring -d kyrazo.com

networks:
  kyrazo-net:
    driver: bridge
    name: kyrazo-net

volumes:
  webroot:
  certbot-etc:
  certbot-var: