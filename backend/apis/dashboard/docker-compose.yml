services:
  dashboard-api:
    build:
      context: ../../
      dockerfile: apis/dashboard/Dockerfile
    container_name: kyrazo-dashboard-api
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3003}/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
