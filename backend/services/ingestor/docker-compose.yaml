services:
  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    restart: always
    environment:
      - PORT=${PORT}
      - WORKERS=${WORKERS}
      - NODE_ENV=${NODE_ENV}

      - CLICKHOUSE_URL=${CLICKHOUSE_URL}

      # STREAM Configuration
      - SNAPSHOT_REDIS_URL=${SNAPSHOT_REDIS_URL}
      - SNAPSHOT_REDIS_TLS=${SNAPSHOT_REDIS_TLS}
      - SNAPSHOT_INTERVAL_MS=${SNAPSHOT_INTERVAL_MS}

      - STREAM_REDIS_URL=${STREAM_REDIS_URL}
      - STREAM_REDIS_TLS=${STREAM_REDIS_TLS}
      - STREAM_BATCH_COUNT=${STREAM_BATCH_COUNT}
      - STREAM_BLOCK_MS=${STREAM_BLOCK_MS}
      - STREAM_MAX_IDLE_MS=${STREAM_MAX_IDLE_MS}
      - STREAM_MAX_RETRIES=${STREAM_MAX_RETRIES}

      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./logs:/app/services/ingestor/logs
      
      - /etc/ssl/redis/ca.crt:/etc/ssl/redis/ca.crt:ro
      - /etc/ssl/redis/client.crt:/etc/ssl/redis/client.crt:ro
      - /etc/ssl/redis/client.key:/etc/ssl/redis/client.:ro

      - /etc/ssl/clickhouse/ca.crt:/etc/ssl/clickhouse/ca.crt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT}/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
