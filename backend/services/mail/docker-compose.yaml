services:
  mail:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    environment:
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}

      # Queue Configuration
      - REDIS_TLS=${REDIS_TLS}
      - REDIS_URL=${REDIS_URL}

      # SMTP Configuration
      - SENDER_MAIL=${SENDER_MAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}
    volumes:
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT}/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
