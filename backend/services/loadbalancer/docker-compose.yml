version: "3.8"

services:
  haproxy:
    image: haproxytech/haproxy-alpine:3.0
    container_name: loadbalancer
    restart: unless-stopped
    command: haproxy -W -f /usr/local/etc/haproxy/haproxy.cfg
    # Use host network so HAProxy can directly reach backend IPs
    network_mode: host
    environment:
      - INGEST_SERVER1_IP=${INGEST_SERVER1_IP}
      - INGEST_SERVER2_IP=${INGEST_SERVER2_IP}
      - DASHBOARD_SERVER1_IP=${DASHBOARD_SERVER1_IP}
      - DASHBOARD_SERVER2_IP=${DASHBOARD_SERVER2_IP}
      - API_SERVER1_IP=${API_SERVER1_IP}
      - API_SERVER2_IP=${API_SERVER2_IP}
    volumes:
      # Map our configuration file into the container
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Map the directory containing certificates
      # NOTE: Place your valid TLS certificate (e.g. from Let's Encrypt)
      # inside this directory named 'cloudflare.pem'
      - /data/coolify/proxy/certs:/etc/haproxy/certs:ro

