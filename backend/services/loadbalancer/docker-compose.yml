services:
  loadbalancer:
    build: .
    network_mode: host
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - PORT=${PORT:-8080}
      - INGEST_SERVER1_IP=${INGEST_SERVER1_IP}
      - INGEST_SERVER2_IP=${INGEST_SERVER2_IP}
      - DASHBOARD_SERVER1_IP=${DASHBOARD_SERVER1_IP}
      - DASHBOARD_SERVER2_IP=${DASHBOARD_SERVER2_IP}
      - API_SERVER1_IP=${API_SERVER1_IP}
      - API_SERVER2_IP=${API_SERVER2_IP}
      - HEALTH_CHECK_PATH=${HEALTH_CHECK_PATH:-/v1/health}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-5}
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-2}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-1000}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-2000}
    deploy:
      resources:
        limits:
          cpus: '2'         # Hard limit of 2 CPU cores
          memory: 4G        # Hard limit of 4GB RAM
        reservations:
          cpus: '0.50'      # Soft reservation of 0.25 CPU cores
          memory: 1G        # Soft reservation of 1GB RAM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: lb-prometheus
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/console_templates'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: lb-grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lb-nginx
    network_mode: host
    volumes:
      - ./nginx/grafana.conf:/etc/nginx/conf.d/grafana.conf:ro
      - /data/coolify/proxy/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    restart: unless-stopped

