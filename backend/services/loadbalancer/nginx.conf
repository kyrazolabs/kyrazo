# Kyrazo API Load Balancer - Nginx Configuration
# Runs behind Coolify's Caddy proxy (which handles SSL)
# Listens on port 8080 (HTTP only)

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 50000;
    multi_accept on;
}

http {
    log_format main '$remote_addr → $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Buffer sizes
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 50s;
    proxy_read_timeout 50s;

    # ─── Upstream: Ingest API ───────────────────────────────────────────
    upstream ingest_backend {
        server INGEST_SERVER1_IP max_fails=1 fail_timeout=3s;
        server INGEST_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Upstream: Dashboard API ────────────────────────────────────────
    upstream dashboard_backend {
        server DASHBOARD_SERVER1_IP max_fails=1 fail_timeout=3s;
        server DASHBOARD_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Upstream: Default API (Integration) ────────────────────────────
    upstream api_backend {
        server API_SERVER1_IP max_fails=1 fail_timeout=3s;
        server API_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Main Server (HTTP on port 8080) ────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # ── /ingest → Ingest Backend ────────────────────────────────────
        location /ingest/ {
            rewrite ^/ingest/(.*) /$1 break;
            proxy_pass http://ingest_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location = /ingest {
            rewrite ^/ingest$ /ingest/ permanent;
        }

        # ── /dashboard → Dashboard Backend ──────────────────────────────
        location /dashboard/ {
            rewrite ^/dashboard/(.*) /$1 break;
            proxy_pass http://dashboard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location = /dashboard {
            rewrite ^/dashboard$ /dashboard/ permanent;
        }

        # ── / → Default API Backend ─────────────────────────────────────
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
