# Kyrazo API Load Balancer - Nginx Configuration
# Install: apt install nginx
# Place this file at: /etc/nginx/nginx.conf
# Test: nginx -t
# Reload: systemctl reload nginx

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 50000;
    multi_accept on;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Buffer sizes (32 KB)
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 50s;
    proxy_read_timeout 50s;

    # ─── Upstream Backends ──────────────────────────────────────────────

    # Ingest API servers
    upstream ingest_backend {
        # Health check: mark server down after 1 fail, retry after 3s
        server INGEST_SERVER1_IP max_fails=1 fail_timeout=3s;
        server INGEST_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # Dashboard API servers
    upstream dashboard_backend {
        server DASHBOARD_SERVER1_IP max_fails=1 fail_timeout=3s;
        server DASHBOARD_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # Default API servers (Integration)
    upstream api_backend {
        server API_SERVER1_IP max_fails=1 fail_timeout=3s;
        server API_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── HTTP → HTTPS Redirect ──────────────────────────────────────────

    server {
        listen 80;
        server_name api.kyrazo.com;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS Server ───────────────────────────────────────────────────

    server {
        listen 443 ssl;
        http2 on;
        server_name api.kyrazo.com;

        # SSL Certificate (same cert HAProxy was using)
        ssl_certificate /data/coolify/proxy/certs/loadbalancer.pem;
        ssl_certificate_key /data/coolify/proxy/certs/loadbalancer.pem;

        # Modern TLS settings
        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # ─── Route: /ingest → Ingest Backend ────────────────────────────

        location /ingest/ {
            # Strip /ingest prefix before forwarding
            rewrite ^/ingest/(.*) /$1 break;

            proxy_pass http://ingest_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;

            # Pass through on backend failure, try next server
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Handle /ingest without trailing slash
        location = /ingest {
            rewrite ^/ingest$ /ingest/ permanent;
        }

        # ─── Route: /dashboard → Dashboard Backend ──────────────────────

        location /dashboard/ {
            # Strip /dashboard prefix before forwarding
            rewrite ^/dashboard/(.*) /$1 break;

            proxy_pass http://dashboard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Handle /dashboard without trailing slash
        location = /dashboard {
            rewrite ^/dashboard$ /dashboard/ permanent;
        }

        # ─── Route: / → Default API Backend ─────────────────────────────

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
