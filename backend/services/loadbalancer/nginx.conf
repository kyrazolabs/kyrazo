# Kyrazo API Load Balancer - Nginx Configuration
# This service runs behind Coolify's Caddy proxy (which handles SSL/TLS termination).
# It serves as a high-performance Layer 7 load balancer specifically for the Kyrazo microservices.

# Run as the 'nginx' user for security
user nginx;

# Automatically set the number of worker processes based on available CPU cores
worker_processes auto;

# Path to the process ID file
pid /run/nginx.pid;

# Log errors to the specified file with a 'warn' severity level
error_log /var/log/nginx/error.log warn;

# Increase the limit of open file descriptors for the worker processes.
# This must be higher than the 'worker_connections' to account for log files and upstream connections.
worker_rlimit_nofile 51200;

events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 50000;
    
    # Allow a worker to accept all new connections at once rather than one by one
    multi_accept on;
}

http {
    # Define a custom log format for detailed request monitoring
    # Includes: client IP, selected upstream, timestamp, request line, status, bytes sent, and response time
    log_format main '$remote_addr → $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$upstream_response_time';

    # Use the 'main' log format defined above for the access log
    access_log /var/log/nginx/access.log main;

    # Optimize data transfer by using the sendfile() system call
    sendfile on;
    # Send the response header and the beginning of a file in one packet
    tcp_nopush on;
    # Disable Nagle's algorithm to send small packets immediately (good for real-time APIs)
    tcp_nodelay on;
    # How long an idle keep-alive connection should remain open
    keepalive_timeout 65;

    # Tuning proxy buffer sizes for handling various response lengths efficiently
    # Initial buffer for the response header received from the upstream server
    proxy_buffer_size 32k;
    # Number and size of buffers for the response body
    proxy_buffers 4 32k;
    # Maximum size of buffers that can be busy sending a response to the client
    proxy_busy_buffers_size 64k;

    # Timeouts for upstream communication
    # Time limit for establishing a connection with an upstream server
    proxy_connect_timeout 5s;
    # Time limit for transmitting a request to the upstream server
    proxy_send_timeout 50s;
    # Time limit for receiving a response from the upstream server
    proxy_read_timeout 50s;

    # ─── Upstream: Ingest API ───────────────────────────────────────────
    # Group of servers handling data ingestion
    upstream ingest_backend {
        # 'max_fails' and 'fail_timeout' define the passive health check.
        # If a server fails 1 request, it is considered unavailable for 3 seconds.
        server INGEST_SERVER1_IP max_fails=1 fail_timeout=3s;
        server INGEST_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Upstream: Dashboard API ────────────────────────────────────────
    # Group of servers for the management dashboard
    upstream dashboard_backend {
        server DASHBOARD_SERVER1_IP max_fails=1 fail_timeout=3s;
        server DASHBOARD_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Upstream: Default API (Integration) ────────────────────────────
    # Group of servers for general API requests and integration
    upstream api_backend {
        server API_SERVER1_IP max_fails=1 fail_timeout=3s;
        server API_SERVER2_IP max_fails=1 fail_timeout=3s;
    }

    # ─── Main Server (HTTP on the dynamic PORT) ─────────────────────────
    server {
        # The 'PORT' placeholder is replaced with the environment variable at runtime by entrypoint.sh
        listen PORT;
        # Listen specifically for requests to the production domain
        server_name api.kyrazo.com;

        # ── Route: /ingest → Ingest Backend ────────────────────────────
        location /ingest/ {
            # Strip the '/ingest' prefix before forwarding to the backend (e.g., /ingest/v1/health -> /v1/health)
            rewrite ^/ingest/(.*) /$1 break;
            
            # Forward traffic to the 'ingest_backend' upstream group
            proxy_pass http://ingest_backend;
            
            # Standard proxy headers to preserve client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Preserve the original protocol (http/https) from the Caddy proxy
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            # If the selected server fails, try the next one in the upstream group
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Redirect '/ingest' (no trailing slash) to '/ingest/' to ensure routing consistency
        location = /ingest {
            rewrite ^/ingest$ /ingest/ permanent;
        }

        # ── Route: /dashboard → Dashboard Backend ──────────────────────
        location /dashboard/ {
            # Strip the '/dashboard' prefix
            rewrite ^/dashboard/(.*) /$1 break;
            
            # Forward to dashboard upstream
            proxy_pass http://dashboard_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Redirect '/dashboard' to '/dashboard/'
        location = /dashboard {
            rewrite ^/dashboard$ /dashboard/ permanent;
        }

        # ── Route: / → Default API Backend ─────────────────────────────
        # Catch-all for any other requests targeting api.kyrazo.com
        location / {
            # Forward to the 'api_backend' group (no prefix stripping needed here)
            proxy_pass http://api_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
