server {
    listen 8443 ssl;
    http2 on;
    server_name gflb.kyrazo.com;

    # SSL Configuration
    # IMPORTANT: cloudflare.pem must contain the CERTIFICATE followed by the PRIVATE KEY.
    # The certificate block (-----BEGIN CERTIFICATE-----) MUST come before the key.
    ssl_certificate         /etc/nginx/certs/cloudflare.pem;
    ssl_certificate_key     /etc/nginx/certs/cloudflare.pem;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*;";

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
