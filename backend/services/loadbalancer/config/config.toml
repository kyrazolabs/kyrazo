# ═══════════════════════════════════════════════════════
# Rust Load Balancer — Configuration
# ═══════════════════════════════════════════════════════

[server]
bind             = "0.0.0.0:8080"    # Coolify forwards traffic here
metrics_bind     = "0.0.0.0:9090"    # Prometheus scrape endpoint
worker_threads   = 0                  # 0 = auto-detect via num_cpus
max_connections  = 100000

# ── Backend Pool ──────────────────────────────────────

[[backends]]
id               = "backend-1"
address          = "http://127.0.0.1:3001"
weight           = 1
max_connections  = 500

[[backends]]
id               = "backend-2"
address          = "http://127.0.0.1:3002"
weight           = 2
max_connections  = 500

[[backends]]
id               = "backend-3"
address          = "http://127.0.0.1:3003"
weight           = 1

# ── Health Checks ─────────────────────────────────────

[health_check]
interval_secs        = 5
timeout_secs         = 2
path                 = "/health"
healthy_threshold    = 2
unhealthy_threshold  = 3

# ── Routing Rules ─────────────────────────────────────

[[rules]]
id              = "api-rule"
match_path      = "/api/*"
match_methods   = ["GET", "POST", "PUT", "DELETE"]
backends        = ["backend-1", "backend-2"]
priority        = 10

[[rules]]
id              = "worker-rule"
match_path      = "/jobs/*"
match_methods   = ["POST"]
backends        = ["backend-3"]
priority        = 5

# ── Rate Limiting ─────────────────────────────────────

[rate_limit]
enabled              = true
requests_per_second  = 1000
burst                = 2000

# ── Retry Policy ─────────────────────────────────────

[retry]
enabled       = true
max_attempts  = 3
backoff_ms    = [50, 200, 500]
