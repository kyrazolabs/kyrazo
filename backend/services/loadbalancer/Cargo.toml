[package]
name = "loadbalancer"
version = "0.1.0"
edition = "2021"
description = "High-performance internal HTTP load balancer"

[dependencies]
tokio            = { version = "1", features = ["full"] }
hyper            = { version = "1", features = ["full"] }
hyper-util       = { version = "0.1", features = ["full"] }
http-body-util   = "0.1"
tower            = { version = "0.4", features = ["full"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
num_cpus         = "1"
arc-swap         = "1"
dashmap          = "5"
tokio-util       = "0.7"
bytes            = "1"
anyhow           = "1"
thiserror        = "1"
prometheus       = "0.13"
once_cell        = "1"
futures          = "0.3"
rand             = "0.8"
clap             = { version = "4", features = ["derive"] }
uuid             = { version = "1", features = ["v4"] }
http             = "1"

[profile.release]
opt-level     = 3
panic         = "abort"
strip         = true
