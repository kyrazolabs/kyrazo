global
    log stdout format raw local0 info
    # Maximum number of concurrent connections across the entire HAProxy process
    maxconn 50000
    # SSL/TLS tuning for high performance and modern security
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11 no-tlsv12 no-tls-tickets
    # Buffer size for I/O operations (32768 bytes = 32 KB)
    tune.bufsize 32768

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_in
    bind *:80
    mode http
    acl is_ssl ssl_fc
    acl is_proxied_ssl hdr(X-Forwarded-Proto) -i https
    redirect scheme https code 301 if !is_ssl !is_proxied_ssl

frontend https_in
    mode http
    # HTTP/1.1 and HTTP/2
    bind *:443 ssl crt /etc/haproxy/certs/loadbalancer.pem alpn h2,http/1.1
    # HTTP/3 (QUIC)
    # Using 'quic4@*:443' requires QUIC support compiled in.
    bind quic4@*:443 ssl crt /etc/haproxy/certs/loadbalancer.pem alpn h3

    # Standard headers for backends behind a proxy
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # Advertise HTTP/3 support via Alt-Svc header
    http-response set-header alt-svc 'h3=":443"; ma=2592000'

    # ACL for the Host
    acl is_api_host hdr(host) -i api.kyrazo.com
    
    # Path-based routing rules (prefixes)
    acl path_ingest path_beg /ingest
    acl path_dashboard path_beg /dashboard

    # Routing
    # Note: Evaluated top to bottom; most specific paths must be listed first
    use_backend api_ingest if is_api_host path_ingest
    use_backend api_dashboard if is_api_host path_dashboard
    
    # If host matches but path wasn't /ingest or /dashboard, fallback to the root API servers
    use_backend api_default if is_api_host

    # Default behavior if host does not match api.kyrazo.com
    default_backend not_found

backend api_ingest
    mode http
    balance roundrobin
    option httpchk
    # http-check send requires keyword arguments in HAProxy 3.0
    http-check send meth GET uri /v1/health ver HTTP/1.1 hdr Host api.kyrazo.com
    http-check expect status 200
    # Health check every 3s, fail after 1 error, recover after 2 successes
    server ingest_server1 "${INGEST_SERVER1_IP}" check inter 3s fall 1 rise 2
    server ingest_server2 "${INGEST_SERVER2_IP}" check inter 3s fall 1 rise 2

    # Strip /ingest prefix before sending to backend
    http-request replace-path ^/ingest/(.*) /\1
    http-request replace-path ^/ingest$ /

backend api_dashboard
    mode http
    balance roundrobin
    option httpchk
    # http-check send requires keyword arguments in HAProxy 3.0
    http-check send meth GET uri /v1/health ver HTTP/1.1 hdr Host api.kyrazo.com
    http-check expect status 200
    # Health check every 3s, fail after 1 error, recover after 2 successes
    server dashboard_server1 "${DASHBOARD_SERVER1_IP}" check inter 3s fall 1 rise 2
    server dashboard_server2 "${DASHBOARD_SERVER2_IP}" check inter 3s fall 1 rise 2

    # Strip /dashboard prefix before sending to backend
    http-request replace-path ^/dashboard/(.*) /\1
    http-request replace-path ^/dashboard$ /

backend api_default
    mode http
    balance roundrobin
    option httpchk
    # http-check send requires keyword arguments in HAProxy 3.0
    http-check send meth GET uri /v1/health ver HTTP/1.1 hdr Host api.kyrazo.com
    http-check expect status 200
    # Health check every 3s, fail after 1 error, recover after 2 successes
    server api_server1 "${API_SERVER1_IP}" check inter 3s fall 1 rise 2
    server api_server2 "${API_SERVER2_IP}" check inter 3s fall 1 rise 2

backend not_found
    mode http
    # Return 404 for unrecognized hosts
    http-request return status 404 content-type "text/plain" string "Service Not Found\n"
