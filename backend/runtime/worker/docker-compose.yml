services:
  scheduler-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler-api
    restart: unless-stopped
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
    networks:
      - kyrazo-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1.5'
          memory: 2G

networks:
  kyrazo-net:
    external: true