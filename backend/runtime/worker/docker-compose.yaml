services:
  worker:
    build:
      context: .
      dockerfile: runtime/worker/Dockerfile
    restart: always
    environment:
      - WORKSPACE_ID=${WORKSPACE_ID}
      - WORKER_ID=${WORKER_ID}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY}
      - BATCH_SIZE=${BATCH_SIZE}
      - MAX_ACK_PENDING=${MAX_ACK_PENDING}
      - FETCH_TIMEOUT_MS=${FETCH_TIMEOUT_MS}
      - NODE_ENV=${NODE_ENV}
      - NATS_SERVERS=${NATS_SERVERS}
      - NATS_USER=${NATS_USER}
      - NATS_PASSWORD=${NATS_PASSWORD}
      - NATS_MAX_RECONNECT_ATTEMPTS=${NATS_MAX_RECONNECT_ATTEMPTS}
      - NATS_RECONNECT_TIME_WAIT=${NATS_RECONNECT_TIME_WAIT}
      - NATS_TIMEOUT=${NATS_TIMEOUT}
      - NATS_CERT_FILE=${NATS_CERT_FILE}
      - NATS_KEY_FILE=${NATS_KEY_FILE}
      - NATS_CA_FILE=${NATS_CA_FILE}
      - MONGODB_URI=${MONGODB_URI}
      - DB_NAME=${DB_NAME}
      - MONGODB_MAX_POOL_SIZE=${MONGODB_MAX_POOL_SIZE}
      - MONGODB_MIN_POOL_SIZE=${MONGODB_MIN_POOL_SIZE}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USERNAME}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - REDIS_DB=${REDIS_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - QUEUE_REDIS_DB=${QUEUE_REDIS_DB}
      - QUEUE_REDIS_HOST=${QUEUE_REDIS_HOST}
      - QUEUE_REDIS_PASSWORD=${QUEUE_REDIS_PASSWORD}
      - QUEUE_REDIS_PORT=${QUEUE_REDIS_PORT}
      - QUEUE_REDIS_URL=${QUEUE_REDIS_URL}
      - QUEUE_REDIS_USERNAME=${QUEUE_REDIS_USERNAME}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FILE=${LOG_FILE}
      - ERROR_LOG_FILE=${ERROR_LOG_FILE}
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
    volumes:
      - /data/nats/certs:/data/nats/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
