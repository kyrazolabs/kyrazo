services:
  worker:
    build:
      context: .
      dockerfile: runtime/worker/Dockerfile
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - WORKERS=1
      - WORKER_ID=${WORKER_ID}
      - WORKSPACE_ID=${WORKSPACE_ID}
      - BATCH_SIZE=${BATCH_SIZE}
      - MAX_ACK_PENDING=${MAX_ACK_PENDING}
      - FETCH_TIMEOUT_MS=${FETCH_TIMEOUT_MS}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY}

      # NATS Configuration
      - NATS_SERVERS=${NATS_SERVERS}
      - NATS_USER=${NATS_USER}
      - NATS_PASSWORD=${NATS_PASSWORD}
      - NATS_MAX_RECONNECT_ATTEMPTS=${NATS_MAX_RECONNECT_ATTEMPTS}
      - NATS_RECONNECT_TIME_WAIT=${NATS_RECONNECT_TIME_WAIT}
      - NATS_TIMEOUT=${NATS_TIMEOUT}
      - NATS_CERT_FILE=${NATS_CERT_FILE}
      - NATS_KEY_FILE=${NATS_KEY_FILE}
      - NATS_CA_FILE=${NATS_CA_FILE}
      - NATS_TLS=${NATS_TLS}

      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${DB_NAME}
      - MONGODB_MAX_POOL_SIZE=${MONGODB_MAX_POOL_SIZE}
      - MONGODB_MIN_POOL_SIZE=${MONGODB_MIN_POOL_SIZE}
      - MONGODB_SSL=${MONGODB_SSL}

      # Clickhouse Configuration
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}

      # Redis Configuration
      - REDIS_URL=${REDIS_URL}
      - REDIS_TLS=${REDIS_TLS}
      - STREAM_REDIS_URL=${STREAM_REDIS_URL}
      - STREAM_REDIS_TLS=${STREAM_REDIS_TLS}
      - QUEUE_REDIS_URL=${QUEUE_REDIS_URL}
      - QUEUE_REDIS_TLS=${QUEUE_REDIS_TLS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./logs:/app/runtime/worker/logs
      - /data/nats/certs:/data/nats/certs:ro
