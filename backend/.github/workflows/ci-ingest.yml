name: CI - Ingest API

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/apis/ingest/**'
      - 'backend/shared/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/apis/ingest/**'
      - 'backend/shared/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install shared dependencies
        run: bun install
        working-directory: backend/shared

      - name: Build shared library
        run: bun run build
        working-directory: backend/shared

      - name: Install service dependencies
        run: bun install
        working-directory: backend/apis/ingest

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: backend/apis/ingest

      - name: Test
        run: bun test
        working-directory: backend/apis/ingest

      - name: Build
        run: bun run build
        working-directory: backend/apis/ingest
