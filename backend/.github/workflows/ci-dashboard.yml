name: CI - Dashboard API

on:
  push:
    branches: [main, develop]
    paths:
      - 'apis/dashboard/**'
      - 'shared/**'
      - '.github/workflows/ci-dashboard.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apis/dashboard/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install shared dependencies
        run: bun install
        working-directory: shared

      - name: Build shared library
        run: bun run build
        working-directory: shared

      - name: Install service dependencies
        run: bun install
        working-directory: apis/dashboard

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: apis/dashboard

      - name: Build
        run: bun run build
        working-directory: apis/dashboard
