<div class="flex items-center gap-2 group">
    <p-button icon="pi pi-copy" size="small" severity="secondary" [outlined]="true"
        styleClass="p-0! w-6! h-6! rounded-lg!" pTooltip="Copy ID" tooltipPosition="top" />
    <span class="font-mono text-sm text-surface-500 dark:text-surface-400"
        [class.truncate]="!fullWidth" [class.max-w-[120px]]="!fullWidth" [pTooltip]="id"
        (onClick)="copy(id)" tooltipPosition="top">
        {{ id }}
    </span>
</div>

<p-toast />
