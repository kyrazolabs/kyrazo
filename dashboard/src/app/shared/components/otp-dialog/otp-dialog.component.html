<p-dialog
    [header]="otpService.state().message"
    [visible]="otpService.state().show"
    (visibleChange)="onVisibleChange($event)"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '400px' }"
>
    <div class="flex flex-col items-center justify-center gap-6 py-4">
        <p class="text-gray-500 text-center text-sm px-4">
            {{ isBackupCode ? 'Please enter one of your 8-character backup codes.' :
               (otpService.state().method === 'app' ? 'Please enter the 6-digit verification code from your authenticator app.' :
               'Please enter the 6-digit verification code sent to your email.') }}
        </p>

        <div class="flex justify-center w-full">
            <p-inputotp *ngIf="!isBackupCode"
                [(ngModel)]="code"
                [length]="6"
                [integerOnly]="true"
                [pAutoFocus]="true"
                (onComplete)="verify()"
                (keyup.enter)="verify()"
            ></p-inputotp>
            <input *ngIf="isBackupCode"
                pInputText
                [(ngModel)]="code"
                placeholder="Enter backup code"
                class="w-full text-center font-mono uppercase rounded-xl! mx-4"
                maxlength="8"
                [pAutoFocus]="true"
                (keyup.enter)="verify()" />
        </div>

        <div *ngIf="error" class="text-red-500 text-sm font-medium text-center px-4">
            {{ error }}
        </div>

        <div class="text-center">
            <button type="button"
                class="text-primary hover:underline bg-transparent border-0 cursor-pointer text-sm font-medium"
                (click)="toggleBackupCode()">
                {{ isBackupCode ? 'Use verification code' : 'Use a backup code' }}
            </button>
        </div>

        <div class="flex flex-row justify-center gap-3 w-full px-4">
            <p-button
                label="Cancel"
                [plain]="true"
                severity="secondary"
                styleClass="w-full rounded-xl!"
                (onClick)="cancel()"
                [disabled]="loading"
            ></p-button>
            <p-button
                label="Verify"
                [loading]="loading"
                styleClass="w-full rounded-xl!"
                (onClick)="verify()"
                [disabled]="isBackupCode ? code.length < 8 : code.length < 6"
            ></p-button>
        </div>

        <div *ngIf="otpService.state().method === 'email' && !isBackupCode" class="mt-2 text-center">
            <button
                type="button"
                class="text-primary hover:underline text-sm font-medium bg-transparent border-0 cursor-pointer"
                (click)="requestNewOtp()"
                [disabled]="loading"
            >
                Didn't receive a code? Request again
            </button>
        </div>
    </div>
</p-dialog>
