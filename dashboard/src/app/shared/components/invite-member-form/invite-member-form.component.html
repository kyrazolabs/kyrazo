<form [formGroup]="inviteForm" (ngSubmit)="inviteMember()" class="flex flex-col gap-4">
    <!-- Email -->
    <div class="flex flex-col gap-2">
        <label class="font-semibold text-surface-900 dark:text-surface-0">Email Address</label>
        <input pInputText type="email" formControlName="email" placeholder="Enter email address"
            class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
            [class.border-red-500]="inviteForm.get('email')?.invalid && inviteForm.get('email')?.touched" />
        <small *ngIf="inviteForm.get('email')?.invalid && inviteForm.get('email')?.touched" class="text-red-500 text-sm">
            Please enter a valid email address
        </small>
    </div>

    <!-- Role -->
    <div class="flex flex-col gap-2">
        <label class="font-semibold text-surface-900 dark:text-surface-0">Role</label>
        <p-select formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value"
            placeholder="Select role" class="w-full rounded-xl!" panelStyleClass="rounded-xl!" size="small" />
    </div>

    <!-- Message -->
    <div class="flex flex-col gap-2">
        <label class="font-semibold text-surface-900 dark:text-surface-0">Message (Optional)</label>
        <textarea pInputTextarea formControlName="message" rows="3"
            placeholder="Add a personal message to the invitation..."
            class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800 resize-none"></textarea>
        <small class="text-surface-600 dark:text-surface-400 text-sm">
            {{inviteForm.get('message')?.value?.length || 0}}/2000 characters
        </small>
    </div>

    <div class="flex justify-end gap-2 mt-4">
        <p-button label="Cancel" icon="pi pi-times" [outlined]="true" severity="secondary"
            styleClass="rounded-xl!" (onClick)="cancel()" />
        <p-button label="Send Invitation" icon="pi pi-send" styleClass="rounded-xl!"
            type="submit" [disabled]="inviteForm.invalid || isInviting" [loading]="isInviting" />
    </div>
</form>
