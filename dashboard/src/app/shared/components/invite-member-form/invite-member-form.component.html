<form [formGroup]="inviteForm" (ngSubmit)="inviteMember()" class="flex flex-col gap-4">
    <!-- Email -->
    <div class="flex flex-col gap-2">
        <p-floatlabel variant="on">
            <input pInputText type="email" formControlName="email"
                class="w-full rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                [class.border-red-500]="inviteForm.get('email')?.invalid && inviteForm.get('email')?.touched" pSize="small" />
            <label>Email Address</label>
        </p-floatlabel>
        <small *ngIf="inviteForm.get('email')?.invalid && inviteForm.get('email')?.touched" class="text-red-500 text-xs italic ml-1">
            Please enter a valid email address
        </small>
    </div>

    <!-- Role -->
    <div class="flex flex-col gap-2">
        <p-floatlabel variant="on">
            <p-select formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value"
                class="w-full rounded-xl!" panelStyleClass="rounded-xl!" size="small" appendTo="body" />
            <label>Role</label>
        </p-floatlabel>
    </div>

    <!-- Message -->
    <div class="flex flex-col gap-2">
        <p-floatlabel variant="on">
            <textarea pInputTextarea formControlName="message" rows="3"
                class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800 resize-none" pSize="small"></textarea>
            <label>Message (Optional)</label>
        </p-floatlabel>
        <small class="text-surface-600 dark:text-surface-400 text-xs italic ml-1">
            {{inviteForm.get('message')?.value?.length || 0}}/2000 characters
        </small>
    </div>

    <div class="flex justify-end gap-2 mt-4">
        <p-button label="Cancel" icon="pi pi-times" [outlined]="true" severity="secondary"
            styleClass="rounded-xl!" (onClick)="cancel()" size="small" />
        <p-button label="Send Invitation" icon="pi pi-send" styleClass="rounded-xl! shadow-md shadow-primary/50 dark:shadow-primary/20"
            type="submit" [disabled]="inviteForm.invalid || isInviting" [loading]="isInviting" size="small" />
    </div>
</form>
