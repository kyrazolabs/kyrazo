<div
    [draggable]="false"
    [style]="{ width: '32rem' }"
    styleClass=""
>
    <div class="flex flex-col items-center text-center space-y-6 p-4">
        <!-- Welcome Icon -->
        <!-- <div class="flex items-center justify-center w-20 h-20 bg-primary rounded-full shadow-lg">
            <i class="pi pi-rocket text-white text-3xl"></i>
        </div> -->


        <!-- Benefits List -->
        <div appScrollReveal class="bg-surface-50 dark:bg-surface-800 rounded-xl p-4 w-full">
            <h3 class="font-semibold text-surface-900 dark:text-surface-0 mb-3">What you can do with projects:</h3>
            <ul class="space-y-2 text-sm text-surface-600 dark:text-surface-300">
                <li class="flex items-center gap-2">
                    <i class="pi pi-check-circle text-green-500"></i>
                    <span>Organize your webhooks by application</span>
                </li>
                <!-- <li class="flex items-center gap-2">
                    <i class="pi pi-check-circle text-green-500"></i>
                    <span>Manage different environments (dev, prod)</span>
                    <p-tag severity="contrast" value="Soon" [rounded]="true" class="text-[10px]!" />
                </li> -->
                <li class="flex items-center gap-2">
                    <i class="pi pi-check-circle text-green-500"></i>
                    <span>Track analytics and deliveries per project</span>
                </li>
            </ul>
        </div>

        <!-- Create Project Form -->
        <form [formGroup]="projectForm" class="w-full space-y-4">
            <div appScrollReveal delay="delay-150" class="space-y-2">
                <label for="projectName" class="block text-sm font-medium text-surface-700 dark:text-surface-300">
                    Project Name *
                </label>
                <input
                    pInputText
                    id="projectName"
                    formControlName="name"
                    placeholder="e.g., My Web App, E-commerce API, Mobile App"
                    class="w-full"
                    [class.ng-invalid]="projectForm.get('name')?.invalid && projectForm.get('name')?.touched"
                />
                <small 
                    *ngIf="projectForm.get('name')?.invalid && projectForm.get('name')?.touched" 
                    class="p-error block"
                >
                    Project name is required and must be at least 3 characters
                </small>
            </div>

            <div appScrollReveal delay="delay-300" class="space-y-2">
                <label for="projectDescription" class="block text-sm font-medium text-surface-700 dark:text-surface-300">
                    Description <span class="text-surface-500">(optional)</span>
                </label>
                <input
                    pInputText
                    id="projectDescription"
                    formControlName="description"
                    placeholder="Brief description of your project..."
                    class="w-full"
                />
            </div>
        </form>

        <!-- Action Buttons -->
        <div appScrollReveal delay="delay-500" class="flex gap-3 w-full pt-4">
            <p-button
                label="Create Project"
                icon="pi pi-plus"
                (click)="onCreate()"
                class="flex-1"
                fluid="true"
                styleClass="rounded-xl! fluid!"
                [disabled]="projectForm.invalid || isCreating"
                [loading]="isCreating"
            />
        </div>
    </div>
</div>
