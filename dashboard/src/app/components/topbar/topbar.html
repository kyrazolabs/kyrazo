<div
    class="border-b-2 border-surface-200 dark:border-surface-900 p-2 mx-auto w-full"
>
    <div class="flex justify-between items-center">
        <div class="flex gap-3 p-1 items-center">
            <p-button
                [outlined]="true"
                [text]="true"
                (click)="openSidebar()"
                [icon]="isOpenSidebar()? 'pi pi-chevron-left' : 'pi pi-chevron-right'"
                class="after:border after:border-surface-300 dark:after:border-surface-600" />
            <div class="flex items-center gap-2">
                <!-- Project Selector (shown only when workspace is selected) -->
                <div class="flex items-center justify-between cursor-pointer duration-300 hover:bg-surface-50 dark:hover:bg-surface-800/50 transition-all" (click)="toggleProjectSelector($event)">
                    <div class="flex justify-between items-center gap-2">
                        <h3 class="text-lg font-medium">{{ selectedProject?.name || 'Select Project' }}</h3>
                        <i class="icon-[lucide--chevrons-up-down] size-5 aspect-square text-surface-400 dark:text-surface-500"></i>
                    </div>
                </div>
                <p class="text-lg font-medium"> {{ pageTitle ? '/' : '' }} </p>
                <p class="text-lg font-medium"> {{ pageTitle ? pageTitle : '' }} </p>
            </div>
        </div>
        <!-- Project Popover -->
        <p-popover #pp styleClass="rounded-2xl!">
            <div class="flex flex-col gap-2">
                <div>
                    <div *ngIf="loadingProjects" class="flex flex-col items-center justify-center p-2">
                        <i class="pi pi-spinner pi-spin"></i>
                        <span class="text-sm">Loading projects...</span>
                    </div>
                    <ul *ngIf="!loadingProjects" class="list-none p-0 m-0 flex flex-col">
                        <li *ngFor="let project of projects" class="flex items-center gap-2 px-2 py-1 hover:bg-emphasis cursor-pointer rounded-lg" (click)="selectProject(project)">
                            <div>
                                <span class="text-sm font-medium">{{ project.name }}</span>
                            </div>
                        </li>
                        <li *ngIf="projects.length === 0 && !loadingProjects" class="flex flex-col items-center justify-center p-2 text-sm text-center text-surface-500 dark:text-surface-400 line-clamp-2">
                            <i class="pi pi-plus" (click)="showCreateProject()"></i>
                            <span class="text-sm">Create One</span>
                        </li>
                    </ul>
                </div>
            </div>
        </p-popover>

        <div class="flex items-center gap-2">
            <!-- <p-button
            [outlined]="true"
            [text]="true"
            [icon]="'pi pi-search'"
            (click)="showSearch()" /> -->
            <p-dialog
                maskStyleClass="backdrop-blur-sm"
                [modal]="true"
                [(visible)]="searchVisible"
                [draggable]="false"
                [closable]="false"
                [position]="'center'"
                [minY]="10"
                [style]="{ width: '25rem' }"
            >
            <ng-template #header>

            </ng-template>
                <div class="flex items-center gap-4 mb-4">
                    <input
                        pInputText
                        id="username"
                        class="flex-auto"
                        autocomplete="off"
                        placeholder="Search ..."
                        fluid
                    />
                </div>
                <div class="w-full h-48 flex justify-center">
                    <div class="justify-center items-center">
                        <i class="size-20 pi pi-search"></i>
                        <p class="text-xl mt-10"> No Results</p>
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <p-button
                        label="Cancel"
                        severity="secondary"
                        (click)="searchVisible = false"
                    />
                    <p-button label="Save" (click)="searchVisible = false" />
                </div>
            </p-dialog>
            <p-button
                [outlined]="true"
                [text]="true"
                (click)="toggleDarkMode()"
                [icon]="isDarkMode()? 'pi pi-moon' : 'pi pi-sun'"
            />
            <div class="relative">
                <p-button
                    pStyleClass="@next"
                    enterFromClass="hidden"
                    enterActiveClass="animate-scalein"
                    leaveToClass="hidden"
                    leaveActiveClass="animate-fadeout"
                    [hideOnOutsideClick]="true"
                    [outlined]="true"
                    [text]="true"
                    icon="pi pi-palette"
                    aria-label="Settings"
                />
                <app-config class="hidden" />
            </div>
            <!-- <p-button
                    [outlined]="true"
                    [text]="true"
                    icon="pi pi-bell"
                    aria-label="Notifications"
                /> -->
            <p-button pRipple
                [outlined]="false"
                variant="text"
                [raised]="false"
                [text]="true"
                styleClass="p-0! rounded-xl!"
                (click)="op.toggle($event)" >
                @if (avatar) {
                    <p-avatar [image]="avatar" size="normal" />
                } @else {
                    <p-avatar icon="pi pi-user" size="normal" />
                }
            </p-button>

            <p-popover #op
                styleClass="rounded-2xl! -mb-10! shadow-2xl! border-2! border-surface-200! dark:border-surface-800!">
                <div class="flex flex-col gap-4 w-36">
                            <ul
                                class="list-none py-0 pr-0 m-0 transition-all duration-400 ease-in-out">
                                <li>
                                    <a pRipple [routerLink]="'/settings/profile'"
                                        class="flex items-center cursor-pointer p-2 rounded-xl text-sm text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                        <i class="pi pi-user mr-2"></i>
                                        <span class="font-medium">Profile</span>
                                    </a>
                                </li>
                                <li>
                                    <a pRipple [routerLink]="'/settings/notifications'"
                                        class="flex items-center cursor-pointer p-2 rounded-xl text-sm text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                        <i class="pi pi-bell mr-2"></i>
                                        <span class="font-medium">Notifications</span>
                                    </a>
                                </li>
                                <!-- <li>
                                    <a pRipple [routerLink]="'/settings/billing'"
                                        class="flex items-center cursor-pointer p-2 rounded-xl text-sm text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                        <i class="pi pi-credit-card mr-2"></i>
                                        <span class="font-medium">Billing</span>
                                    </a>
                                </li> -->
                                <li>
                                    <a pRipple (click)="logout()"
                                        class="flex items-center cursor-pointer p-2 rounded-xl text-sm text-surface-700 dark:text-surface-100 hover:text-red-700 dark:hover:text-red-500 hover:bg-red-100 dark:hover:bg-red-700/30 duration-150 transition-colors p-ripple">
                                        <i class="pi pi-sign-out mr-2"></i>
                                        <span class="font-medium">Logout</span>
                                    </a>
                                </li>
                    </ul>
                </div>
            </p-popover>
        </div>
    </div>
</div>



<p-dialog header="Create Project" [(visible)]="visible" [modal]="true" [style]="{ width: '50rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [maximizable]="true">
    <div class="grid grid-cols-5">

    </div>
    <ng-template #footer>
        <p-button label="Cancel" [text]="true" severity="secondary" (click)="visible = false" />
        <p-button label="Save" [outlined]="true" severity="secondary" (click)="visible = false" />
    </ng-template>
</p-dialog>
