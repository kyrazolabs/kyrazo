<div
    class="bg-transparent p-6 rounded-2xl border border-surface-200 dark:border-surface-800 flex flex-col gap-4">
    <div class="w-full flex items-center justify-between">
        <span class="font-medium text-base">Recent Webhooks</span>
        <span class="font-medium text-sm text-primary-500 dark:text-primary-400">View All</span>
    </div>
    <div class="flex flex-col gap-3">
        @for (webhook of webhooks; track $index) {
            <div class="flex items-center gap-3 p-3 border border-surface-100 dark:border-surface-800 rounded-lg bg-surface-50 dark:bg-surface-800">
                <i [ngClass]="['pi', webhook.icon, webhook.color, 'text-lg!']"></i>
                <div class="flex flex-col gap-1">
                    <span class="text-sm font-medium">{{ webhook.text }}</span>
                    <span class="text-xs text-surface-600 dark:text-surface-400">{{ webhook.time }}</span>
                </div>
            </div>
        }
    </div>
</div>
