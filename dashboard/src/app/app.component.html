<div class="bg-surface-0 dark:bg-surface-950 min-h-screen min-w-screen" [@routeAnimations]="prepareRoute(outlet)">
  <div *ngIf="loader.loading$ | async"
    class="fixed right-6 bottom-6 z-1 bg-surface-0! dark:bg-surface-950! flex justify-center items-center gap-2 py-1.5 px-2 rounded-xl! border border-surface-200 dark:border-surface-700 shadow">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-width="1">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke-linecap="round" stroke-width="2">
          <animate attributeName="stroke-dasharray" calcMode="spline" dur="0.75s"
            keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite"
            values="0 150;42 150;42 150;42 150" />
          <animate attributeName="stroke-dashoffset" calcMode="spline" dur="0.75s"
            keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite"
            values="0;-16;-59;-59" />
        </circle>
        <animateTransform attributeName="transform" dur="1s" repeatCount="indefinite" type="rotate"
          values="0 12 12;360 12 12" />
      </g>
    </svg>
    <span class="text-xs font-semibold">Loading...</span>
  </div>
  <router-outlet #outlet="outlet"></router-outlet>
  <p-toast></p-toast>
</div>

<app-config class="hidden"/>
