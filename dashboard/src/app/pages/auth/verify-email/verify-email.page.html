<div class="bg-surface-50 dark:bg-surface-950 min-h-screen w-full flex items-center justify-center p-4">
    <p-card class="bg-transparent shadow-sm! w-full max-w-md mx-auto rounded-2xl!">
        <ng-template pTemplate="header">
            <div class="text-center pt-10! pb-2">
                <div class="text-surface-900 dark:text-surface-0 text-3xl font-semibold mb-2">
                    Email Verification
                </div>
                <p class="text-surface-600 dark:text-surface-300 text-sm mb-4">
                    Confirming your identity to keep your account secure
                </p>
            </div>
        </ng-template>

        <ng-template pTemplate="content">
            <div class="text-center py-6">
                <!-- Loading State -->
                <div *ngIf="loading()" class="space-y-4">
                    <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
                    <p class="text-surface-600 dark:text-surface-300">Verifying your email address...</p>
                </div>

                <!-- Success State -->
                <div *ngIf="!loading() && success()" class="space-y-4 scale-in">
                    <div class="bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 border border-green-200 dark:border-green-800">
                        <i class="pi pi-check text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-surface-900 dark:text-surface-0">Success!</h3>
                    <p class="text-surface-600 dark:text-surface-300">Your email has been verified successfully. You can now log in to your account.</p>
                    <p-button label="Back to Login" icon="pi pi-arrow-left" [routerLink]="'/auth/login'" styleClass="w-full rounded-xl! mt-4" />
                </div>

                <!-- Error State -->
                <div *ngIf="!loading() && error()" class="space-y-4 scale-in">
                    <div class="bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 border border-red-200 dark:border-red-800">
                        <i class="icon-[hugeicons--alert-circle] size-12"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-surface-900 dark:text-surface-0">Verification Failed</h3>
                    <p class="text-red-500 text-sm">{{ error() }}</p>
                    <div class="flex flex-col gap-2 mt-4">
                        <p-button label="Try Again" icon="pi pi-refresh" (onClick)="ngOnInit()" severity="secondary" styleClass="w-full rounded-xl!" />
                        <p-button label="Back to Login" [routerLink]="'/auth/login'" [outlined]="true" styleClass="w-full rounded-xl!" />
                    </div>
                </div>
            </div>
        </ng-template>
    </p-card>
</div>
