<div class="bg-surface-50 dark:bg-surface-950 min-h-screen w-full flex items-center justify-center p-4">
    <p-card class="bg-transparent shadow-lg rounded-2xl w-full max-w-md mx-auto">
        <ng-template pTemplate="header">
            <div class="text-center pt-6 pb-2">
                <div class="text-surface-900 dark:text-surface-0 text-3xl font-semibold mb-2">
                    Reset Password
                </div>
                <p class="text-surface-600 dark:text-surface-300 text-sm mb-4">
                    enter your new password to continue
                </p>
                <div class="text-surface-600 dark:text-surface-300 text-sm">
                    Remembered your password?
                    <a class="font-medium no-underline ml-1 text-primary hover:text-primary-600 cursor-pointer transition-colors duration-200"
                        [routerLink]="'/auth/login'">
                        Sign in here
                    </a>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="content">
            <div *ngIf="success()" class="text-center space-y-4 py-4">
                <i class="pi pi-check-circle text-6xl text-success"></i>
                <div class="text-surface-900 dark:text-surface-0 text-xl font-medium">Password Reset Successful!</div>
                <p class="text-surface-600 dark:text-surface-300">
                    Your password has been updated. Redirecting to login...
                </p>
                <p-button [routerLink]="['/auth/login']" label="Go to Login" styleClass="w-full rounded-xl!" />
            </div>

            <form *ngIf="!success()" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
                <!-- New Password -->
                <div class="space-y-1">
                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-sm">
                        New Password *
                    </label>
                    <p-password id="password" formControlName="password" [toggleMask]="true"
                        placeholder="Enter your new password" styleClass="w-full"
                        inputStyleClass="w-full rounded-xl!" [feedback]="true"
                        [class.p-invalid]="isFieldInvalid('password')" />
                    <small *ngIf="isFieldInvalid('password')" class="p-error block mt-1 text-xs">
                        {{ getFieldErrorMessage('password') }}
                    </small>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1">
                    <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 font-medium text-sm">
                        Confirm Password *
                    </label>
                    <p-password id="confirmPassword" formControlName="confirmPassword" [toggleMask]="true"
                        [feedback]="false" placeholder="Confirm your new password" styleClass="w-full"
                        inputStyleClass="w-full rounded-xl!" [class.p-invalid]="isFieldInvalid('confirmPassword')" />
                    <small *ngIf="isFieldInvalid('confirmPassword')" class="p-error block mt-1 text-xs">
                        {{ getFieldErrorMessage('confirmPassword') }}
                    </small>
                </div>

                <!-- Action Button -->
                <div class="pt-2">
                    <p-button type="submit" label="Reset Password" icon="pi pi-key" [loading]="loading()" [disabled]="!isFormValid"
                        styleClass="w-full rounded-xl! font-medium" />
                </div>

                <div class="text-center pt-4">
                    <a [routerLink]="['/auth/login']"
                        class="text-sm font-medium no-underline text-primary hover:text-primary-600 cursor-pointer transition-colors duration-200">
                        Back to Login
                    </a>
                </div>
            </form>
        </ng-template>
    </p-card>
</div>
