<div class="space-y-6">
    <!-- Header -->
    <div
        class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6"
    >
        <!-- Left section -->
        <div>
            <h1 class="text-2xl font-bold">Ingest Event Details</h1>
            <p class="opacity-80">
                View source event information and payload details
            </p>
        </div>

        <!-- Right section -->
        <div class="flex items-center gap-4">
            <p-button
                label="Back to Events"
                icon="pi pi-arrow-left"
                [outlined]="true"
                severity="secondary"
                routerLink="/dashboard/events/ingest/logs"
                styleClass="rounded-2xl!"
            />
        </div>
    </div>

    <!-- Event Information Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Basic Event Info -->
        <p-card
            header="Event Information"
            class="card-panel h-full"
        >
            <div class="space-y-4">
                <div>
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Event ID</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.event_id"
                        [readonly]="true"
                        class="w-full font-mono rounded-xl!"
                    />
                </div>

                <div>
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Source</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.source"
                        [readonly]="true"
                        class="w-full rounded-xl!"
                    />
                </div>
                <div class="flex flex-row gap-4">
                    <div>
                        <label
                            class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                            >Status</label
                        >
                        <p-tag
                            [value]="ingestEvent.processing_status"
                            [severity]="getStatusSeverity(ingestEvent.processing_status || '')"
                            class="text-sm"
                            [rounded]="true"
                        >
                        </p-tag>
                    </div>
    
                    <div>
                        <label
                            class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                            >Verified</label
                        >
                        <p-tag
                            [value]="ingestEvent.verified ? 'Verified' : 'Unverified'"
                            [severity]="ingestEvent.verified ? 'success' : 'warn'"
                            class="text-sm"
                            [rounded]="true"
                        >
                        </p-tag>
                    </div>
                </div>


                <div *ngIf="ingestEvent.processing_error">
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Processing Error</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.processing_error"
                        [readonly]="true"
                        class="w-full rounded-xl!"
                    />
                </div>

                <div *ngIf="ingestEvent.associated_event_id">
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Associated Event ID</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.associated_event_id"
                        [readonly]="true"
                        class="w-full font-mono rounded-xl!"
                    />
                </div>

                <div *ngIf="ingestEvent.route_to">
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Route To</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.route_to"
                        [readonly]="true"
                        class="w-full rounded-xl!"
                    />
                </div>


                <div>
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Max Retries</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.route_max_retries"
                        [readonly]="true"
                        class="w-full rounded-xl!"
                    />
                </div>

                <div>
                    <label
                        class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                        >Route Inserted At</label
                    >
                    <input
                        type="text"
                        pInputText
                        [value]="ingestEvent.route_inserted_at"
                        [readonly]="true"
                        class="w-full rounded-xl!"
                    />
                </div>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                            >Received At</label
                        >
                        <input
                            type="text"
                            pInputText
                            [value]="ingestEvent.received_at"
                            [readonly]="true"
                            class="w-full rounded-xl!"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1"
                            >Processed At</label
                        >
                        <input
                            type="text"
                            pInputText
                            [value]="ingestEvent.updated_at"
                            [readonly]="true"
                            class="w-full rounded-xl!"
                        />
                    </div>
                </div>
            </div>
        </p-card>

        <!-- Request Details -->
        <p-card
            header="Request Details"
            class="card-panel h-full!"
        >
            <div class="flex static flex-col gap-4 h-full!">
                <div class="flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-surface-900 dark:text-surface-0">Request Headers</label>
                        <p-button
                            icon="pi pi-copy"
                            [outlined]="true"
                            severity="secondary"
                            size="small"
                            styleClass="rounded-xl!"
                            (onClick)="copy(ingestEvent.headers)"
                            [disabled]="!ingestEvent.headers || ingestEvent.headers === '{}'"
                        />
                    </div>
                    <div class="card-panel min-h-[132px] max-h-[132px] overflow-y-auto scrollbar-thin scrollbar-thumb-surface-300 dark:scrollbar-thumb-surface-600 scrollbar-track-surface-100 dark:scrollbar-track-surface-800 scroll-smooth">
                        <ngx-json-viewer
                            *ngIf="!rawView && ingestEvent.headers && ingestEvent.headers !== '{}'"
                            [json]="parseJson(ingestEvent.headers)"
                        ></ngx-json-viewer>
                        <pre
                            *ngIf="rawView && ingestEvent.headers && ingestEvent.headers !== '{}'"
                            class="text-sm text-surface-900 dark:text-surface-0 whitespace-pre-wrap"
                        >{{ ingestEvent.headers }}</pre>
                        <p
                            *ngIf="!ingestEvent.headers || ingestEvent.headers === '{}'"
                            class="text-surface-500 dark:text-surface-400 italic"
                        >No request headers</p>
                    </div>
                </div>

                <div class="flex-1 flex flex-col h-full!">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-surface-900 dark:text-surface-0">Request Body</label>
                        <p-button
                            icon="pi pi-copy"
                            [outlined]="true"
                            severity="secondary"
                            size="small"
                            styleClass="rounded-xl!"
                            (onClick)="copy(ingestEvent.body)"
                            [disabled]="!ingestEvent.body || ingestEvent.body === '{}'"
                        />
                    </div>
                    <div class="card-panel min-h-[132px] max-h-[132px] overflow-y-auto scrollbar-thin scrollbar-thumb-surface-300 dark:scrollbar-thumb-surface-600 scrollbar-track-surface-100 dark:scrollbar-track-surface-800 scroll-smooth">
                        <ngx-json-viewer
                            *ngIf="!rawView && ingestEvent.body && ingestEvent.body !== '{}'"
                            [json]="parseJson(ingestEvent.body)"
                        ></ngx-json-viewer>
                        <pre
                            *ngIf="rawView && ingestEvent.body && ingestEvent.body !== '{}'"
                            class="text-sm text-surface-900 dark:text-surface-0 whitespace-pre-wrap"
                        >{{ ingestEvent.body }}</pre>
                        <p
                            *ngIf="!ingestEvent.body || ingestEvent.body === '{}'"
                            class="text-surface-500 dark:text-surface-400 italic"
                        >No request body</p>
                    </div>
                </div>
            </div>
        </p-card>
    </div>

    <!-- Additional Actions -->
    <div class="flex items-center justify-end gap-3">
        <p-button
            [label]="rawView ? 'View Tree Data' : 'View Raw Data'"
            [icon]="rawView ? 'pi pi-sitemap' : 'pi pi-file-o'"
            [outlined]="!rawView"
            [severity]="rawView ? 'primary' : 'secondary'"
            [styleClass]="rawView ? 'w-full rounded-xl!' : 'rounded-xl!'"
            (onClick)="toggleRawView()"
        />
    </div>
</div>
