<div class="space-y-6">

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="flex flex-col gap-6">
        <!-- Basic Information -->
        <p-card header="Basic Information"
            class="card-panel">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- First Name -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">First Name</label>
                    <input pInputText type="text" formControlName="firstName" placeholder="Enter your first name"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        [class.border-red-500]="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched" />
                    <small *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched"
                        class="text-red-500 text-sm">
                        First name is required and must be at least 2 characters
                    </small>
                </div>

                <!-- Last Name -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Last Name</label>
                    <input pInputText type="text" formControlName="lastName" placeholder="Enter your last name"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        [class.border-red-500]="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched" />
                    <small *ngIf="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched"
                        class="text-red-500 text-sm">
                        Last name is required and at least 2 characters
                    </small>
                </div>

                <!-- Email Address -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Email Address</label>
                    <input pInputText type="email" formControlName="email" placeholder="Enter your email address"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        [class.border-red-500]="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" />
                    <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
                        class="text-red-500 text-sm">
                        Please enter a valid email address
                    </small>
                </div>


                <!-- Job Title -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Job Title</label>
                    <input pInputText type="text" formControlName="jobTitle" placeholder="Enter your job title"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800" />
                </div>
            </div>
        </p-card>

        <!-- Account Settings -->
        <p-card header="Account Settings"
            class="card-panel">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Time Zone -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Time Zone</label>
                    <p-select formControlName="timeZone" [options]="timezoneOptions" optionLabel="label"
                        optionValue="value" [filter]="true" filterBy="label" filterPlaceholder="Search ..."
                        placeholder="Select timezone" class="w-full rounded-xl!" panelStyleClass="rounded-xl!" size="small" />
                </div>

                <!-- Language -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Language</label>
                    <p-select formControlName="language" [options]="languageOptions" optionLabel="label"
                        optionValue="value" placeholder="Select language" styleClass="w-full rounded-xl!"
                        panelStyleClass="rounded-xl!" size="small" />
                </div>

                <!-- Account Status -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Account Status</label>
                    <div class="flex items-center pt-2">
                        <p-tag [value]="originalProfile?.isActive ? 'Active' : 'Inactive'"
                            [severity]="originalProfile?.isActive ? 'success' : 'danger'" class="text-sm font-medium"
                            [rounded]="true" />
                    </div>
                </div>

                <!-- Member Since -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Member Since</label>
                    <input pInputText type="text" [value]="originalProfile?.createdAt ? formatDate(originalProfile!.createdAt) : 'N/A'" placeholder="Enter workspace name"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        readonly disabled />
                </div>

                <!-- Last Login -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Last Login</label>
                    <input pInputText type="text" [value]="originalProfile?.lastLogin ? formatDate(originalProfile!.lastLogin) : 'Never'" placeholder="Enter workspace name"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        readonly disabled />
                </div>

                <!-- Account ID -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Account ID</label>
                    <div class="flex items-center gap-2">
                        <input pInputText type="text" [value]="originalProfile?.id || 'N/A'" placeholder="Enter workspace name"
                            class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                            readonly disabled />
                        <p-button icon="pi pi-copy" [outlined]="true" size="small" styleClass="rounded-xl!"
                            pTooltip="Copy Account ID" tooltipStyleClass="text-xs! rounded-xl!" tooltipPosition="top"
                            (onClick)="copyToClipboard(originalProfile?.id || '')" />
                    </div>
                </div>
            </div>
        </p-card>

        <!-- Change Password -->
        <p-card header="Security & Password"
            class="card-panel">
            <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Current Password -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Current Password</label>
                    <input pInputText type="password" formControlName="currentPassword" placeholder="********"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        [class.border-red-500]="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched" />
                </div>

                <!-- New Password -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">New Password</label>
                    <input pInputText type="password" formControlName="newPassword" placeholder="********"
                        class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                        [class.border-red-500]="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" />
                    <small class="text-xs opacity-60">Min. 8 characters</small>
                </div>

                <!-- Confirm Password -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-surface-900 dark:text-surface-0">Confirm New Password</label>
                    <div class="flex flex-col gap-2">
                        <input pInputText type="password" formControlName="confirmPassword" placeholder="********"
                            class="w-full p-3 rounded-xl! border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800"
                            [class.border-red-500]="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched" />
                        <p-button label="Update Password" icon="pi pi-lock" styleClass="rounded-xl! w-full"
                            [disabled]="passwordForm.invalid || isChangingPassword" [loading]="isChangingPassword"
                            (onClick)="changePassword()" />
                    </div>
                    <small *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched"
                        class="text-red-500 text-xs">
                        Passwords do not match
                    </small>
                </div>
            </form>
        </p-card>
    </form>

</div>
