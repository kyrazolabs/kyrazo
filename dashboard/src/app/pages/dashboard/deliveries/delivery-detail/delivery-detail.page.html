<div class="space-y-6">
    <!-- Header -->
    <div
        class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
        <!-- Left section -->
        <div>
            <h1 class="text-2xl font-bold">Delivery Details</h1>
            <p class="opacity-80">View webhook delivery information and response details</p>
        </div>

        <!-- Right section -->
        <div class="flex items-center gap-4">
            <p-button label="Back to Deliveries" icon="pi pi-arrow-left" [outlined]="true" severity="secondary"
                routerLink="/dashboard/deliveries" styleClass="rounded-xl!" />
        </div>
    </div>

    <!-- Delivery Information Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Basic Delivery Info -->
        <p-card header="Delivery Information"
            class="card-panel">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Delivery
                        ID</label>
                    <input type="text" pInputText [value]="delivery.delivery_id" [readonly]="true"
                        class="w-full font-mono rounded-xl!" />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Endpoint
                        URL</label>
                    <input type="text" pInputText [value]="delivery.target_url" [readonly]="true"
                        class="w-full rounded-xl!" />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Status</label>
                    <p-tag [value]="delivery.status" [severity]="getStatusSeverity(delivery.status)" class="text-sm" [rounded]="true">
                    </p-tag>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Response
                        Code</label>
                    <p-tag [value]="delivery.response_code?.toString()" [severity]="getResponseCodeSeverity(delivery.response_code)"
                        class="text-sm" [rounded]="true">
                    </p-tag>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Scheduled At</label>
                        <input type="text" pInputText [value]="delivery.scheduled_at" [readonly]="true" class="w-full rounded-xl!" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-1">Processed At</label>
                        <input type="text" pInputText [value]="delivery.processed_at" [readonly]="true" class="w-full rounded-xl!" />
                    </div>
                </div>
            </div>
        </p-card>

        <!-- Request Details -->
        <p-card header="Request Details"
            class="card-panel">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-2">Request
                        Headers</label>
                    <textarea pInputTextarea [value]="delivery.request_header | json" [readonly]="true" rows="6"
                        class="w-full text-xs font-mono rounded-xl!">
            </textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-2">Payload</label>
                    <textarea pInputTextarea [value]="delivery.request_body | json" [readonly]="true" rows="6"
                        class="w-full text-xs font-mono rounded-xl!">
            </textarea>
                </div>
            </div>
        </p-card>
    </div>

    <!-- Response Details - Full Width -->
    <p-card header="Response Details"
        class="card-panel">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-2">Response
                    Headers</label>
                <textarea pInputTextarea [value]="delivery.response_header | json" [readonly]="true" rows="8"
                    class="w-full text-xs font-mono rounded-xl!">
          </textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-surface-900 dark:text-surface-0 mb-2">Response
                    Body</label>
                <textarea pInputTextarea [value]="delivery.response_body | json" [readonly]="true" rows="8"
                    class="w-full text-xs font-mono rounded-xl!">
          </textarea>
            </div>
        </div>

        <p-divider />

        <!-- Additional Actions -->
        <div class="flex items-center justify-end gap-3">
            <p-button label="Retry Delivery" icon="pi pi-refresh" [outlined]="true" severity="secondary"
                styleClass="rounded-xl!" [disabled]="delivery.status === 'delivered'" />
            <p-button label="View Raw Data" icon="pi pi-file-o" [outlined]="true" styleClass="rounded-xl!" />
        </div>
    </p-card>
</div>
