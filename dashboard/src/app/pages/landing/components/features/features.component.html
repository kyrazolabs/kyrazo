        <!-- Core Capabilities Section -->
        <div class="text-center mb-16" appScrollReveal>
            <span
                class="text-primary-500 font-bold uppercase tracking-[0.2em] text-[10px] px-3 py-1 bg-primary-500/10 rounded-full border border-primary-500/20">The
                Platform</span>
            <h2 class="text-3xl md:text-5xl font-extrabold mt-6 text-surface-900 dark:text-surface-0 tracking-tight">
                Ingest, Dispatch, Automate.
            </h2>
            <p class="mt-4 text-lg text-surface-600 dark:text-surface-400 max-w-2xl mx-auto">Everything you need to
                build robust event-driven architectures with speed and reliability.</p>
        </div>
        <!-- Ingest & Dispatch Top Duo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-[1400px] mx-auto mb-12">
            <div *ngFor="let cap of capabilities.slice(0, 2); let i = index" appScrollReveal
                [delay]="'delay-' + (i * 200 + 100)" class="group relative transition-all duration-300">
                <div
                    class="relative p-6 rounded-2xl bg-surface-0 dark:bg-surface-950 border border-surface-200 dark:border-surface-800 h-full shadow-xs group-hover:shadow-sm hover:shadow-primary-500/10 overflow-hidden flex flex-col">
                    <!-- Diagram Container -->
                    <div
                        class="relative mb-10 flex items-center justify-center rounded-2xl transition-colors overflow-hidden shrink-0 h-64">
                        <div class="transition-transform w-full duration-700 ease-out">
                            <ng-container [ngSwitch]="cap.diagram">
                                <app-ingest-diagram *ngSwitchCase="'ingest'"></app-ingest-diagram>
                                <app-dispatch-diagram *ngSwitchCase="'dispatch'"></app-dispatch-diagram>
                            </ng-container>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="relative z-10 flex flex-col grow">
                        <div class="flex items-center gap-4 mb-6">
                            <h3
                                class="text-3xl font-black text-surface-900 dark:text-surface-0 tracking-tight transition-colors leading-tight">
                                {{ cap.title }}</h3>
                            <div
                                [class]="'px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider backdrop-blur-md border border-white/5 ' + cap.bg + ' ' + cap.color">
                                {{ cap.subtitle }}
                            </div>
                        </div>
                        <p
                            class="text-surface-600 dark:text-surface-400 leading-relaxed font-medium opacity-80 group-hover:opacity-100 transition-opacity">
                            {{ cap.description }}</p>

                        <!-- <div class="mt-auto pt-8 flex items-center gap-2 text-primary-500 font-bold text-sm tracking-tight group/link">
                            <span>Get started with {{ cap.title.split(' ')[0] }}</span>
                            <i class="pi pi-arrow-right text-[10px] transform group-hover/link:translate-x-1 transition-transform"></i>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Automation Featured Section -->
        <div class="max-w-7xl mx-auto" appScrollReveal delay="delay-200">
            <div *ngIf="capabilities[2] as automate" class="group relative transition-all duration-500">
                <div
                    class="absolute top-6 right-6 z-20 flex items-center gap-1.5 px-3 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20 rounded-full text-[10px] font-bold uppercase tracking-wider backdrop-blur-md shadow-sm">
                    <i class="icon-[hugeicons--sparkles] text-sm"></i>
                    <span>Almost Here</span>
                </div>
                <div
                    class="relative  w-full p-10 md:p-12 rounded-2xl bg-linear-to-br from-surface-0 to-surface-50 dark:from-surface-950 dark:to-surface-900/50 border-2 border-primary-400/10 dark:border-primary-600/10 h-full overflow-hidden flex flex-col items-center text-center">
                    <!-- Featured Diagram Container -->
                    <div
                        class="relative mb-12 w-full max-w-4xl h-[300px] flex items-center justify-center overflow-hidden shrink-0">
                        <div class="transition-transform w-full duration-500 ease-out">
                            <app-workflow-diagram></app-workflow-diagram>
                        </div>
                    </div>

                    <!-- Featured Content -->
                    <div class="relative z-10 flex flex-col items-center">
                        <div class="flex items-center gap-4 mb-6 justify-center">
                            <div
                                class="px-3 py-1 rounded-full bg-purple-500/10 text-purple-500 border border-purple-500/20 text-[9px] font-black uppercase tracking-[0.3em]">
                                Standalone Power
                            </div>
                            <span class="text-surface-400 font-medium text-[10px]">Dynamic Fan-out</span>
                        </div>

                        <h2
                            class="text-3xl md:text-5xl font-black mb-6 text-surface-900 dark:text-surface-0 tracking-tighter leading-tight group-hover:text-primary-600 duration-300 transition-colors">
                            {{ automate.title }}
                        </h2>

                        <p
                            class="text-surface-600 dark:text-surface-400 leading-relaxed text-base md:text-lg font-medium mb-8 max-w-3xl mx-auto">
                            {{ automate.description }}
                        </p>

                        <!-- Special Features Badges -->
                        <div class="flex flex-wrap gap-2 mb-10 justify-center">
                            <div *ngFor="let f of automate.features"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-surface-50 dark:bg-surface-800/40 border border-surface-200 dark:border-surface-700 text-[10px] font-bold text-surface-600 dark:text-surface-400">
                                <i class="pi pi-check-circle text-primary-500"></i>
                                {{ f }}
                            </div>
                        </div>

                        <!-- <div class="flex flex-col sm:flex-row items-center gap-4 justify-center">
                            <p-button styleClass="rounded-2xl!" class="px-3!">
                                Design Your Workflow
                            </p-button>
                            <p-button label="See live examples" [link]="true" styleClass="font-bold! text-surface-600! dark:text-surface-400! text-sm!"></p-button>
                        </div> -->
                    </div>

                    <!-- Featured Background Decorations -->
                    <div
                        class="absolute top-0 right-0 w-[400px] h-[400px] bg-primary-500/5 blur-[100px] rounded-full -translate-y-1/2 translate-x-1/2">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-[300px] h-[300px] bg-purple-500/5 blur-[80px] rounded-full translate-y-1/2 -translate-x-1/2">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
