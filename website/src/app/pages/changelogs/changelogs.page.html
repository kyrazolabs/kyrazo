<div class="space-y-20 max-w-4xl mb-8 container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <!-- Left section -->
        <div>
            <h1 class="text-3xl font-bold">Changelogs</h1>
            <p class="opacity-80">Track latest updates, improvements, and fixes</p>
        </div>

        <!-- Right section -->
        <!-- <div class="flex items-center gap-4">
            <p-button label="Subscribe to Updates" icon="pi pi-bell" [outlined]="true" severity="secondary"
                styleClass="rounded-xl!" [size]="'small'" (onClick)="null" />
        </div> -->
    </div>

    <!-- Timeline -->
    <div class="max-w-4xl mx-auto">
        <p-timeline [value]="events" align="left" styleClass="w-full customized-timeline">
            <ng-template pTemplate="marker" let-event>
                <div class="w-4 h-4 rounded-full bg-primary-500 border-2 border-surface-0 dark:border-surface-900 shadow-md z-10 ring-4 ring-primary-50 dark:ring-primary-900/20"></div>
            </ng-template>

            <ng-template pTemplate="content" let-event>
                <div class="ml-6 mb-12">
                    <p-card styleClass="shadow-sm hover:shadow-md transition-shadow duration-300 border border-surface-200 dark:border-surface-800 rounded-2xl! overflow-hidden p-0">
                        <ng-template pTemplate="header">
                            <div class="px-6 pt-6 flex items-start justify-between">
                                <div class="flex flex-col gap-1">
                                    <h3 class="text-xl font-bold text-surface-900 dark:text-surface-0 m-0">{{ event.week }}</h3>
                                    <div class="flex items-center gap-2 text-sm text-surface-500 dark:text-surface-400">
                                        <i class="pi pi-calendar text-xs"></i>
                                        <span>{{ event.date }}</span>
                                    </div>
                                </div>
                                <p-tag [value]="event.status | titlecase" [severity]="getTypeSeverity(event.type)" [rounded]="true" styleClass="text-xs font-semibold px-3 py-1" />
                            </div>
                        </ng-template>
                        
                        <div class="px-2 pb-2">
                             <div class="mb-4">
                                <h4 class="text-lg font-semibold mb-2 text-surface-800 dark:text-surface-100">{{ event.title }}</h4>
                                <p class="text-surface-600 dark:text-surface-300 leading-relaxed">{{ event.description }}</p>
                             </div>
                             
                             <div class="bg-surface-50 dark:bg-surface-900/50 rounded-xl p-4 border border-surface-100 dark:border-surface-800/50">
                                 <ul class="list-none p-0 m-0 space-y-3">
                                     <li *ngFor="let change of event.changes" class="flex items-start gap-3 text-surface-700 dark:text-surface-200">
                                         <i class="pi pi-check-circle text-primary-500 mt-1 text-sm"></i>
                                         <span class="leading-snug">{{ change }}</span>
                                     </li>
                                 </ul>
                             </div>
                        </div>
                    </p-card>
                </div>
            </ng-template>
        </p-timeline>
    </div>
</div>
