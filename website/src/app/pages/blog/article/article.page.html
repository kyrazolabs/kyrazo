<div class="container mx-auto px-4 py-12 max-w-5xl">
  <!-- Loading State -->
  <div *ngIf="isLoading()" class="flex justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="error()" class="text-center py-20">
      <p class="text-red-500 text-xl mb-4">{{ error() }}</p>
      <a routerLink="/blog" class="text-primary hover:text-primary-emphasis font-medium">&larr; Back to Blog</a>
  </div>

  <!-- Article Content -->
  <article *ngIf="article() && !isLoading()" class="bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-sm overflow-hidden">
      <!-- Cover Image -->
      <div class="w-full h-64 md:h-[400px] relative bg-surface-100 dark:bg-surface-800">
          <img *ngIf="article()!.cover"
               [src]="cmsService.getImageUrl(article()!.cover!.url)"
               [alt]="article()!.cover!.alternativeText || article()!.title"
               class="w-full h-full object-cover">
          <div *ngIf="!article()!.cover" class="w-full h-full flex items-center justify-center text-surface-400">
             <span class="text-6xl italic opacity-30">Kyrazo</span>
          </div>
      </div>

      <div class="p-8 md:p-12 lg:px-16">
          <!-- Meta -->
          <div class="flex flex-wrap items-center gap-4 text-sm text-surface-500 dark:text-surface-400 mb-8">
              <a routerLink="/blog" class="text-primary hover:text-primary-emphasis font-medium transition-colors">&larr; Back to Blog</a>
              <span class="w-1 h-1 bg-surface-300 rounded-full"></span>
              <span *ngIf="article()!.category" class="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                  {{ article()!.category!.name }}
              </span>
              <span class="w-1 h-1 bg-surface-300 rounded-full"></span>
              <span>{{ article()!.publishedAt | date:'longDate' }}</span>
          </div>

          <!-- Title -->
          <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-surface-900 dark:text-surface-0 mb-6 leading-tight tracking-tight">
              {{ article()!.title }}
          </h1>

          <!-- Author -->
          <div class="flex items-center mb-10 pb-10 border-b border-surface-200 dark:border-surface-700" *ngIf="article()!.author">
               <img *ngIf="article()!.author!.picture"
                   [src]="cmsService.getImageUrl(article()!.author!.picture!.url)"
                   class="w-12 h-12 rounded-full object-cover mr-4 ring-2 ring-primary/20">
              <div>
                  <div class="font-bold text-surface-900 dark:text-surface-0">{{ article()!.author!.name }}</div>
                  <div class="text-sm text-surface-500">{{ article()!.author!.email }}</div>
              </div>
          </div>

          <!-- Blocks Rendering -->
          <div class="space-y-10 max-w-none">
              <ng-container *ngFor="let block of article()!.blocks">

                  <!-- Rich Text Block -->
                  <div *ngIf="block.__component === 'shared.rich-text'"
                       class="prose prose-lg dark:prose-invert max-w-none
                              prose-headings:font-bold prose-headings:tracking-tight prose-headings:text-surface-900 dark:prose-headings:text-surface-0
                              prose-p:text-surface-600 dark:prose-p:text-surface-300 prose-p:leading-relaxed
                              prose-a:text-primary prose-a:font-medium prose-a:no-underline hover:prose-a:underline
                              prose-strong:text-surface-900 dark:prose-strong:text-surface-0
                              prose-img:rounded-2xl prose-img:shadow-md">
                       <div [innerHTML]="$any(block).body | markdown"></div>
                  </div>

                  <!-- Quote Block -->
                  <div *ngIf="block.__component === 'shared.quote'" class="border-l-4 border-primary pl-8 py-6 my-10 bg-surface-50 dark:bg-surface-800/30 rounded-r-xl">
                      <blockquote class="text-2xl italic font-serif text-surface-900 dark:text-surface-100 mb-4 leading-relaxed">
                          "{{ $any(block).body }}"
                      </blockquote>
                      <cite class="text-sm font-bold text-primary uppercase tracking-widest block not-italic">
                          — {{ $any(block).title }}
                      </cite>
                  </div>

                  <!-- Media Block (If implemented later) -->
                  <!-- <div *ngIf="block.__component === 'shared.media'">...</div> -->

              </ng-container>
          </div>
      </div>
  </article>
</div>
