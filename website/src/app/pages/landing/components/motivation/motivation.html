<!-- Problem / Solution Header -->
<section
  id="trust"
  class="relative w-full overflow-hidden rounded-[3rem] border border-surface-800 bg-surface-950 py-28 shadow-lg"
>
  <!-- Background Mesh -->
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 opacity-10"
    style="background-image: radial-gradient(#3b82f6 2px, transparent 2px); background-size: 30px 30px;"
  ></div>

  <div class="relative z-10 mx-auto max-w-7xl px-6">
    <!-- Header -->
    <div class="mb-20 flex justify-center">
      <div class="max-w-4xl text-center" appScrollReveal>
        <!-- <div
          class="mb-6 inline-flex items-center gap-2 rounded-full border border-primary-500/20 bg-primary-500/10 px-3 py-1"
        >
          <span
            class="text-[10px] font-black uppercase tracking-[0.3em] text-primary-400"
          >
            Enterprise Grade
          </span>
        </div> -->

        <h2 class="mb-6 text-3xl font-bold text-surface-0 md:text-5xl">
          Stop Building
          <span class="text-primary-400">Webhook Infrastructure.</span>
        </h2>

        <p
          class="mx-auto max-w-2xl text-lg leading-relaxed text-surface-500 dark:text-surface-300"
        >
          Manually handling retries, signatures, scaling, and failures at scale
          turns webhooks into a liability.
          <br class="hidden md:block" />
          Kyrazo removes the operational burden entirely.
        </p>
      </div>
    </div>

    <!-- Problems Grid -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (item of items; track item.title) {
        <div
          appScrollReveal
          [delay]="'delay-' + ($index * 100 + 100)"
          class="group relative overflow-hidden rounded-2xl border border-surface-800/50 bg-surface-900/30 p-6 transition-all duration-500 hover:border-primary-500/50 hover:bg-surface-900/35"
        >
          <!-- Glow -->
          <div
            class="absolute -top-24 -right-24 h-24 w-24 rounded-full bg-primary-500/0 blur-[60px] transition-all duration-700 group-hover:bg-primary-500/5"
          ></div>

          <div class="relative z-10">
            <div class="mb-8 flex items-center gap-4">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl border border-surface-700 bg-surface-800 text-primary-500 transition-all duration-500 group-hover:border-primary-500/20 group-hover:bg-primary-500/10">
                <span class="text-2xl" [class]="item.icon"></span>
              </div>
              <h3
                class="text-xl font-bold tracking-tight text-white transition-colors group-hover:text-primary-300"
              >
                {{ item.title }}
              </h3>
            </div>

            <p
              class="font-medium leading-relaxed text-surface-400 opacity-80 transition-opacity group-hover:opacity-100"
            >
              {{ item.description }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
