<div class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 px-4 transition-all duration-500">
    <div class="w-full max-w-6xl rounded-3xl">
        <div class="w-full max-w-7xl rounded-3xl border transition-all duration-300 px-4 flex items-center justify-between relative "
            [ngClass]="{
                'bg-transparent border-transparent py-2': !isScrolled,
                'bg-surface-0/90 dark:bg-surface-950/75 backdrop-blur-xl border-surface-200 dark:border-surface-800 shadow-xs py-3': isScrolled
            }">

            <div class="flex items-center justify-center gap-3 cursor-pointer transition-transform duration-300"  [class.scale-90]="isScrolled" routerLink="/" aria-label="Home">
                <img [src]="isDarkMode() ? 'logo-dark.png' : 'logo-light.png'" alt="Kyrazo logo" width="40" height="40" class="h-10 p-1 rounded-xl bg-primary dark:bg-primary flex items-center justify-center transition-transform duration-300" >
                <span class="text-3xl font-bold text-surface-950 dark:text-surface-0">Kyrazo</span>
            </div>

            <!-- Center Nav -->
            <!-- <div class="hidden md:flex items-center gap-1 rounded-full p-1 transition-all duration-300 border absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
                [ngClass]="{
                    'bg-surface-0/50 dark:bg-surface-950/50 border-surface-200 dark:border-surface-800 backdrop-blur-sm shadow-sm': !isScrolled,
                    'bg-transparent border-transparent': isScrolled
                }">
                @for (item of items; track item.label) {
                    <button
                        (click)="item.command?.({originalEvent: $event})"
                        class="bg-transparent border-none text-surface-600 dark:text-surface-300 hover:text-primary-500 hover:bg-surface-100 dark:hover:bg-surface-800 px-3 py-2 rounded-3xl font-medium transition-colors cursor-pointer text-sm">
                        {{ item.label }}
                    </button>
                }
            </div> -->

            <!-- Right Actions -->
            <div class="flex items-center gap-2">
                <p-button
                    [outlined]="true"
                    [rounded]="true"
                    [text]="true"
                    (click)="toggleDarkMode()"
                    [icon]="isDarkMode()? 'pi pi-moon' : 'pi pi-sun'"
                    ariaLabel="Toggle color theme"
                    styleClass="w-9 h-9 rounded-xl!"
                />
                <div class="relative">
                    <p-button
                        #settingsButton
                        (click)="toggleConfig()"
                        [outlined]="true"
                        [text]="true"
                        icon="pi pi-palette"
                        ariaLabel="Settings"
                    />
                    @if (showConfig) {
                        <app-config @dropdownAnimation />
                    }
                </div>

                <div class="h-5 w-px bg-surface-300 dark:bg-surface-700 mx-1"></div>

                <p-button label="Log In" (click)="trackLogin()" [text]="true" size="small" styleClass="text-sm! w-18! font-bold! rounded-xl!"></p-button>
                <p-button label="Get Started" (click)="trackGetStarted()" severity="primary" size="small" styleClass="text-sm! w-26! font-bold! rounded-xl!"></p-button>
            </div>
        </div>
    </div>
</div>
