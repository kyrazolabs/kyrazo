<div class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 px-4 transition-all duration-500">
    <div class="w-full max-w-6xl rounded-3xl">
        <div class="w-full max-w-7xl rounded-3xl border transition-all duration-300 px-4 flex items-center justify-between relative "
            [ngClass]="{
                'bg-transparent border-transparent py-2': !isScrolled,
                'bg-surface-0/90 dark:bg-surface-950/75 backdrop-blur-xl border-surface-200 dark:border-surface-800 shadow-xs py-3': isScrolled
            }">

            <div class="flex items-center justify-center gap-2 sm:gap-3 cursor-pointer transition-transform duration-300"  [class.scale-90]="isScrolled" routerLink="/" aria-label="Home">
                <img [src]="isDarkMode() ? 'logo-dark.png' : 'logo-light.png'" alt="Kyrazo logo" width="40" height="40" class="h-8 w-8 sm:h-10 sm:w-10 p-1 rounded-xl bg-primary dark:bg-primary flex items-center justify-center transition-transform duration-300" >
                <span class="text-2xl sm:text-3xl font-bold text-surface-950 dark:text-surface-0">Kyrazo</span>
            </div>

            <!-- Center Nav -->
            <div class="hidden md:flex items-center gap-1 rounded-full p-1 transition-all duration-300 border border-transparent absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
                [ngClass]="{
                    'bg-surface-0/50 dark:bg-surface-950/50 border-surface-200 dark:border-surface-800 backdrop-blur-sm shadow-sm': !isScrolled && !activeDropdown(),
                    'bg-transparent border-transparent ': isScrolled || activeDropdown(),
                    'bg-surface-0/50 dark:bg-surface-950/50 border-surface-200 dark:border-surface-800 shadow-sm': activeDropdown() && !isScrolled
                }">
                @for (item of items; track $index) {
                    <div class="relative flex items-center"
                        (mouseenter)="item.items ? onMouseEnter(item.label!) : null"
                        (mouseleave)="item.items ? onMouseLeave() : null">
                        <button
                            (click)="item.items ? toggleDropdown($event, item.label!) : item.command?.({originalEvent: $event})"
                            [class.dropdown-trigger]="item.items"
                            class="bg-transparent border-none text-surface-600 dark:text-surface-300 hover:text-primary-500 hover:bg-surface-100 dark:hover:bg-surface-800 px-3 py-2 rounded-3xl font-medium transition-colors cursor-pointer text-sm flex items-center gap-1 group">
                            {{ item.label }}
                            @if (item.items) {
                                <i class="pi pi-chevron-down text-[10px] transition-transform duration-300" [class.rotate-180]="activeDropdown() === item.label"></i>
                            }
                        </button>

                        @if (item.items && activeDropdown() === item.label) {
                            <div @dropdownAnimation
                                class="dropdown-menu absolute top-full left-0 mt-2 min-w-[200px] bg-surface-0/90 dark:bg-surface-950/75 backdrop-blur-xl border border-surface-200 dark:border-surface-800 rounded-2xl shadow-xl p-2 z-50">
                                @for (subItem of item.items; track subItem.label) {
                                    <a
                                        [routerLink]="subItem.routerLink"
                                        (click)="subItem.command?.({originalEvent: $event})"
                                        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-surface-600 dark:text-surface-300 hover:text-primary-500 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors cursor-pointer no-underline">
                                        @if (subItem.icon) {
                                            <i [class]="subItem.icon + ' text-lg'"></i>
                                        }
                                        <span class="font-medium">{{ subItem.label }}</span>
                                    </a>
                                }
                            </div>
                        }
                    </div>
                }

            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-1 sm:gap-2">
                <p-button
                    [outlined]="true"
                    [rounded]="true"
                    [text]="true"
                    (click)="toggleDarkMode()"
                    [icon]="isDarkMode()? 'pi pi-moon' : 'pi pi-sun'"
                    ariaLabel="Toggle color theme"
                    styleClass="w-8 h-8 sm:w-9 sm:h-9 rounded-xl!"
                />
                <div class="relative hidden sm:block">
                    <p-button
                        #settingsButton
                        (click)="toggleConfig()"
                        [outlined]="true"
                        [text]="true"
                        icon="pi pi-palette"
                        ariaLabel="Settings"
                    />
                    @if (showConfig) {
                        <app-config @dropdownAnimation />
                    }
                </div>

                <div class="h-5 w-px bg-surface-300 dark:bg-surface-700 mx-1 hidden sm:block"></div>

                <p-button label="Log In" (click)="trackLogin()" [text]="true" size="small" styleClass="text-xs sm:text-sm! w-14 sm:w-18! font-bold! rounded-xl!"></p-button>
                <p-button label="Get Started" (click)="trackGetStarted()" severity="primary" size="small" styleClass="text-xs sm:text-sm! w-22 sm:w-26! font-bold! rounded-xl!"></p-button>
            </div>
        </div>
    </div>
</div>
