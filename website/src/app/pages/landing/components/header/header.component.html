<div class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 px-4 transition-all duration-500">
    <div class="w-full max-w-7xl rounded-3xl">
        <div class="w-full max-w-7xl rounded-3xl border transition-all duration-300 px-4 flex items-center justify-between relative "
            [ngClass]="{
                'bg-transparent border-transparent py-2': !isScrolled,
                'bg-surface-0/90 dark:bg-surface-950/75 backdrop-blur-xl border-surface-200 dark:border-surface-800 shadow-xs py-3': isScrolled
            }">
            
            <div class="flex items-center justify-center gap-3 cursor-pointer transition-transform duration-300"  [class.scale-90]="isScrolled" routerLink="/">
                <img [src]="isDarkMode() ? 'logo-dark.png' : 'logo-light.png'" alt="Kyrazo" class="h-10 p-1 rounded-xl bg-primary dark:bg-primary flex items-center justify-center transition-transform duration-300" >
                <span class="text-3xl font-bold text-surface-950 dark:text-surface-0">Kyrazo</span>
            </div>
    
            <!-- Center Nav -->
            <!-- <div class="hidden md:flex items-center gap-1 rounded-full p-1 transition-all duration-300 border absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
                [ngClass]="{
                    'bg-surface-0/50 dark:bg-surface-950/50 border-surface-200 dark:border-surface-800 backdrop-blur-sm shadow-sm': !isScrolled,
                    'bg-transparent border-transparent': isScrolled
                }">
                <button *ngFor="let item of items" 
                    (click)="item.command?.({originalEvent: $event})"
                    class="bg-transparent border-none text-surface-600 dark:text-surface-300 hover:text-primary-500 hover:bg-surface-100 dark:hover:bg-surface-800 px-3 py-2 rounded-3xl font-medium transition-colors cursor-pointer text-sm">
                    {{ item.label }}
                </button>
            </div> -->
    
            <!-- Right Actions -->
            <div class="flex items-center gap-2">
                <p-button
                    [outlined]="true"
                    [rounded]="true"
                    [text]="true"
                    (click)="toggleDarkMode()"
                    [icon]="isDarkMode()? 'pi pi-moon' : 'pi pi-sun'"
                    styleClass="w-9 h-9 rounded-2xl!"
                />
                <div class="relative">
                    <p-button
                        pStyleClass="@next"
                        enterFromClass="hidden"
                        enterActiveClass="animate-scalein"
                        leaveToClass="hidden"
                        leaveActiveClass="animate-fadeout"
                        [hideOnOutsideClick]="true"
                        [outlined]="true"
                        [text]="true"
                        icon="pi pi-palette"
                        aria-label="Settings"
                    />
                    <app-config class="hidden" />
                </div>
                
                <div class="h-5 w-px bg-surface-300 dark:bg-surface-700 mx-1"></div>
                
                <p-button label="Log In" routerLink="/auth/login" [text]="true" size="small" styleClass="text-sm! w-18! font-bold! rounded-2xl!"></p-button>
                <p-button label="Get Started" routerLink="/auth/register" severity="primary" size="small" styleClass="text-sm! w-26! font-bold! rounded-2xl!"></p-button>
            </div>
        </div>
        <div class="border-b-2 py-1 transition-colors duration-100 max-w-[1400px]"
            [ngClass]="{
                'bg-transparent border-transparent py-2': isScrolled,
                'border-surface-200 dark:border-surface-800': !isScrolled
            }"
        ></div>
    </div>
</div>
