<div class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 px-4 transition-all duration-500" [class.-translate-y-full]="isHeaderHidden()" [class.opacity-0]="isHeaderHidden()">
    <div class="w-full max-w-7xl rounded-2xl">
        <div class="w-full max-w-7xl rounded-xl border transition-all duration-300 px-2 flex items-center justify-between relative  py-2 "
            [ngClass]="{
                'bg-transparent border-transparent mt-6': !isScrolled,
                'bg-surface-950/90 backdrop-blur-xs border-surface-800 shadow-lg': isScrolled && headerService.currentTheme() === 'dark',
                'bg-white/80 backdrop-blur-xs border-surface-200 shadow-xl': isScrolled && headerService.currentTheme() === 'light'
            }">

            <div class="flex items-center justify-center gap-2 sm:gap-3 cursor-pointer transition-transform duration-300"  [class.scale-90]="isScrolled" routerLink="/" aria-label="Home">
                <img [src]="(isScrolled && headerService.currentTheme() === 'light') ? 'logo-light.png' : 'logo-light.png'" alt="Kyrazo logo" width="40" height="40" class="h-8 w-8 sm:h-10 sm:w-10 p-1 rounded-xl bg-primary-500 flex items-center justify-center transition-transform duration-300" >
                <span class="bg-linear-to-b bg-clip-text text-transparent tracking-tighter text-2xl sm:text-3xl font-bold font-sansation"
                    [ngClass]="(isScrolled && headerService.currentTheme() === 'dark') ? 'from-white to-surface-400' : 'from-black to-surface-600'">Kyrazo</span>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center px-2 gap-1 sm:gap-2">
                <p-button label="Contact Sales" (click)="contactSales()" severity="primary" size="small"
                    styleClass="text-xs sm:text-sm! w-26 sm:w-32! font-bold! rounded-xl!"></p-button>
            </div>
        </div>
    </div>
</div>
