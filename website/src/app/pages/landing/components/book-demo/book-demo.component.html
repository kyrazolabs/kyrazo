<section
    id="book-demo"
    class="py-16 md:py-24 px-4 md:px-6 bg-surface-0 dark:bg-surface-950 relative overflow-hidden"
>
    <div
        class="absolute top-0 inset-x-0 h-px bg-linear-to-r from-transparent via-surface-200 dark:via-surface-800 to-transparent"
    ></div>

    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-10 md:mb-14" appScrollReveal>
            <h2
                class="text-3xl md:text-5xl font-bold mb-6 text-surface-900 dark:text-surface-0 tracking-tight"
            >
                <span
                    class="bg-linear-to-b from-black to-surface-600 bg-clip-text font-sansation! text-transparent"
                    >Book a <span class="text-primary-500 font-sansation!">Discovery Meeting</span></span
                >
            </h2>
            <p
                class="text-base md:text-lg text-surface-600 dark:text-surface-400 max-w-2xl mx-auto"
            >
                Tell us about your event architecture and we'll scope a fully
                isolated deployment — dedicated compute, database, and delivery
                workers for your workload.
            </p>
        </div>

        <div
            class="rounded-2xl border border-surface-200 dark:border-surface-800 overflow-hidden shadow-xl bg-white"
            appScrollReveal
            delay="delay-200"
        >
            <div
                class="calendly-inline-widget"
                [attr.data-url]="calendlyUrl"
                style="min-width: 320px; height: 700px"
            ></div>
        </div>
    </div>
</section>
