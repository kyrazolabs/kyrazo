<section
  class="landing-hero group flex flex-col items-center justify-center text-center px-6 py-20 md:py-32 bg-transparent overflow-hidden relative min-h-screen"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
>
  <div class="relative z-10 max-w-4xl mx-auto">
    <div class="mb-6 inline-block animate-fade-in-up">
      <span
        class="px-4 py-2 rounded-full bg-primary-500/10 text-primary-600 dark:text-primary-400 text-sm font-semibold border border-primary-500/20"
      >
        Early Access — The Next Gen Webhooks
      </span>
    </div>

    <h1
      class="text-5xl md:text-7xl font-bold mb-6 text-surface-900 dark:text-surface-0 tracking-tight leading-tight flex flex-col md:flex-row items-center justify-center gap-2 md:gap-4 relative animate-fade-in-up delay-100"
    >
      <span>Speed meets</span>
      <div class="relative inline-block">
        <span class="relative z-10 px-1">
            Complexity
            <svg class="absolute inset-0 w-full h-full pointer-events-none overflow-visible translate-y-3" viewBox="0 0 400 40" preserveAspectRatio="none">
                <!-- Handwritten strikethrough line with slight curve and imperfections -->
                <path d="M 10 20 Q 100 17 200 18 Q 300 19 390 15" 
                        class="stroke-primary-500"
                        stroke-width="2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="1"/>
                
                <path d="M 12 22 Q 118 20 205 20 Q 305 20 388 17" 
                        class="stroke-primary-500"
                        stroke-width="1.2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="0.95"/>
                <path d="M 12 22 Q 105 18 205 19 Q 305 20 388 17" 
                        class="stroke-primary-500"
                        stroke-width="1.2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="0.85"/>
            </svg>
        </span>
        <span 
            class="absolute -top-10 md:-top-14 left-1/2 w-max text-4xl md:text-6xl text-primary-500 rotate-[-10deg]"
            style="font-family: 'Caveat', cursive;"
        >
            Simplicity
        </span>
      </div>
    </h1>

    <p
      class="text-xl md:text-2xl text-surface-600 dark:text-surface-300 mb-10 max-w-2xl mx-auto leading-relaxed animate-fade-in-up delay-200"
    >
      Faster, and more developer-friendly than ever.
      <br class="hidden md:block" />
      Receive, send, and route events with confidence.
    </p>

    <div
      class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-16 animate-fade-in-up delay-300"
    >
      <p-button
        label="Get Early Access"
        routerLink="/auth/register"
        (click)="trackEarlyAccess()"
        styleClass="text-base! font-bold! shadow-xl! shadow-primary-500/20 rounded-3xl!  px-4!"
        [rounded]="true"
        size="small"
        class="w-full sm:w-auto"
      ></p-button>
      <p-button
        label="View Documentation"
        (click)="trackDocs()"
        icon="icon-[hugeicons--book-02] size-4.5"
        severity="secondary"
        styleClass="text-base! rounded-3xl! px-4!"
        [outlined]="true"
        [rounded]="true"
        size="small"
        class="w-full sm:w-auto"
      ></p-button>
    </div>

    <div class="pt-8 border-t border-surface-200 dark:border-surface-900 animate-fade-in-up delay-400">
      <p class="text-surface-500 dark:text-surface-400 text-sm mb-4">
        Trusted by developers handling scale
      </p>
      <div
        class="flex gap-2 justify-center text-surface-900 dark:text-surface-0 font-medium"
      >
        <span
          >Processing over
          <span class="font-bold text-primary-500 relative z-10">millions
            <svg class="absolute inset-0 w-full h-full pointer-events-none overflow-visible translate-y-3" viewBox="0 0 400 40" preserveAspectRatio="none">
                <!-- Handwritten strikethrough line with slight curve and imperfections -->
                <path d="M 10 20 Q 100 17 200 18 Q 300 19 390 15" 
                        class="stroke-primary-500"
                        stroke-width="2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="1"/>
                
                <path d="M 12 22 Q 118 20 205 20 Q 305 20 388 17" 
                        class="stroke-primary-500"
                        stroke-width="1.2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="0.95"/>
                <path d="M 12 22 Q 105 18 205 19 Q 305 20 388 17" 
                        class="stroke-primary-500"
                        stroke-width="1.2" 
                        fill="none" 
                        stroke-linecap="round"
                        opacity="0.85"/>
            </svg>
          </span>
          monthly</span
        >
      </div>
    </div>
  </div>
</section>
