        <div
            class="relative w-full h-full flex items-center justify-center py-6 overflow-hidden"
        >
            <!-- Diagram Container -->
            <div
                class="relative flex flex-col md:flex-row items-center justify-between w-full max-w-5xl h-full gap-8 md:gap-0"
            >
                <!-- Input Event (Top/Left) -->
                <div class="z-20">
                    <div
                        class="px-3 md:px-4 lg:px-5 py-2 md:py-2.5 lg:py-3 rounded-xl lg:rounded-2xl bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 flex items-center gap-2 md:gap-4 shadow-xl shadow-black/5"
                    >
                        <div
                            class="w-2 h-2 md:w-2.5 lg:w-3 md:h-2.5 lg:h-3 rounded-full bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.6)] animate-pulse"
                        ></div>
                        <div class="flex flex-col">
                            <span
                                class="text-[9px] md:text-[10px] lg:text-xs font-black uppercase tracking-widest text-surface-900 dark:text-surface-0"
                                >Inbound Webhook</span
                            >
                        </div>
                    </div>
                </div>

                <!-- Connection SVG Layer (Horizontal - Visible on MD+) -->
                <svg
                    class="hidden md:block absolute inset-0 w-full h-full pointer-events-none"
                    viewBox="0 0 1000 500"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                >
                    <defs>
                        <!-- Flow Indicator filter -->
                        <filter id="glow">
                            <feGaussianBlur
                                stdDeviation="2"
                                result="coloredBlur"
                            />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Input to Center Pipe -->
                    <path
                        d="M0,250 L500,250"
                        class="stroke-primary-500/30 fill-none stroke-3 line-dash"
                    />

                    <!-- Center to Actions Pipes (S-Curves) -->
                    @for (path of actionPaths; track $index) {
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/10 fill-none stroke-2"
                        />
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/40 fill-none stroke-3 line-dash animation-delay"
                            [style.animation-delay]="$index * 0.4 + 's'"
                        />
                    }
                </svg>

                <!-- Connection SVG Layer (Vertical - Visible on Mobile) -->
                <svg
                    class="block md:hidden absolute inset-0 w-full h-full pointer-events-none"
                    viewBox="0 0 500 1000"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                >
                    <!-- Input to Center -->
                    <path
                        d="M250,0 L250,500"
                        class="stroke-primary-500/30 fill-none stroke-3 line-dash"
                    />
                    <!-- Center to Actions -->
                    <path
                        d="M250,500 C250,650 100,750 100,1000"
                        class="stroke-primary-500/10 fill-none stroke-2"
                    />
                    <path
                        d="M250,500 C250,650 100,750 100,1000"
                        class="stroke-primary-500/40 fill-none stroke-3 line-dash animation-delay"
                    />

                    <path
                        d="M250,500 L250,1000"
                        class="stroke-primary-500/10 fill-none stroke-2"
                    />
                    <path
                        d="M250,500 L250,1000"
                        class="stroke-primary-500/40 fill-none stroke-3 line-dash animation-delay"
                        style="animation-delay: 0.4s"
                    />

                    <path
                        d="M250,500 C250,650 400,750 400,1000"
                        class="stroke-primary-500/10 fill-none stroke-2"
                    />
                    <path
                        d="M250,500 C250,650 400,750 400,1000"
                        class="stroke-primary-500/40 fill-none stroke-3 line-dash animation-delay"
                        style="animation-delay: 0.8s"
                    />
                </svg>

                <!-- Kyrazo Center -->
                <div
                    class="relative z-20 w-12 h-12 md:w-14 lg:w-16 md:h-14 lg:h-16 aspect-square! rounded-xl lg:rounded-2xl bg-primary dark:bg-primary flex flex-col items-center justify-center shadow-2xl shadow-primary-500/30 border-2 border-primary-300 dark:border-primary-800 group/center transition-transform duration-500 cursor-help"
                >
                    <img
                        [src]="
                            isDarkMode() ? 'logo-dark.png' : 'logo-light.png'
                        "
                        alt="Kyrazo"
                        width="64"
                        height="64"
                        loading="lazy"
                        decoding="async"
                        class="w-full h-full p-2 lg:p-3 object-contain transition-transform duration-300"
                    />
                    <!-- Center Pulse Rings -->
                    <div
                        class="absolute inset-0 rounded-2xl border-2 border-primary-500 animate-ping opacity-20"
                    ></div>
                    <div
                        class="absolute -inset-2 md:-inset-4 rounded-3xl border border-primary-500/10 animate-pulse"
                    ></div>
                </div>

                <!-- Actions (Bottom/Right) -->
                <div class="flex flex-row md:flex-col gap-4 md:gap-12 lg:gap-20 z-20">
                    @for (action of actions; track action.name) {
                        <div class="flex items-center gap-3 md:gap-5 group cursor-default">
                            <div
                                class="p-2 md:px-4 md:py-2 lg:px-5 lg:py-2.5 rounded-lg md:rounded-xl lg:rounded-2xl bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 flex items-center gap-2 md:gap-3 shadow-xl shadow-black/5 transition-all group-hover:border-primary-500/50 group-hover:shadow-primary-500/10"
                            >
                                <span [class]="action.iconClass" class="text-lg md:text-xl lg:text-2xl"></span>
                                <span class="hidden md:inline text-[9px] md:text-[10px] lg:text-xs font-black uppercase tracking-widest text-surface-900 dark:text-surface-50">{{ action.name }}</span>
                            </div>
                        </div>
                    }
                </div>
            </div>

            <!-- Enhanced Global Background Glow -->
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-primary-500/5 blur-[100px] md:blur-[150px] rounded-full pointer-events-none -z-10"
            ></div>
        </div>
