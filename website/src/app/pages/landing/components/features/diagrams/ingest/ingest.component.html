        <div
            class="relative w-full h-full flex items-center justify-center py-4 overflow-hidden"
        >
            <!-- Diagram Container -->
            <div
                class="relative flex items-center justify-between w-full max-w-xl h-full px-2 md:px-4"
            >
                <!-- Sources (Left) -->
                <div class="flex flex-col gap-3 md:gap-5 z-20">
                    @for (source of sources; track source.name) {
                        <div class="flex items-center gap-3">
                            <div
                                class="w-8 h-8 md:w-9 md:h-9 p-1 md:p-1.5 rounded-lg md:rounded-xl bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-sm flex items-center justify-center"
                            >
                                <span
                                    [class]="source.iconClass"
                                    class="text-xl md:text-2xl"
                                ></span>
                            </div>
                        </div>
                    }
                </div>

                <!-- Connection SVG Layer -->
                <svg
                    class="absolute inset-0 w-full h-full pointer-events-none"
                    viewBox="0 0 400 300"
                    preserveAspectRatio="xMidYMid meet"
                    aria-hidden="true"
                >
                    <defs>
                        <linearGradient
                            id="ingestFlow"
                            x1="0%"
                            y1="0%"
                            x2="100%"
                            y2="0%"
                        >
                            <stop
                                offset="0%"
                                stop-color="var(--primary-500)"
                                stop-opacity="0.1"
                            />
                            <stop
                                offset="100%"
                                stop-color="var(--primary-500)"
                                stop-opacity="0.4"
                            />
                        </linearGradient>
                    </defs>

                    <!-- Source to Center Pipes -->
                    @for (path of sourcePaths; track $index) {
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/10 fill-none stroke-2 md:stroke-3"
                        />
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/30 fill-none stroke-2 md:stroke-3 line-dash animation-delay"
                            [style.animation-delay]="$index * 0.4 + 1.2 + 's'"
                        />
                    }

                    <!-- Center to Destinations Pipes -->
                    @for (path of destPaths; track $index) {
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/15 fill-none stroke-2 md:stroke-3"
                        />
                        <path
                            [attr.d]="path.d"
                            class="stroke-primary-500/40 fill-none stroke-2 md:stroke-3 line-dash animation-delay"
                            [style.animation-delay]="$index * 0.4 + 1.5 + 's'"
                        />
                    }
                </svg>

                <!-- Kyrazo Ingest (Center) -->
                <div
                    class="relative z-20 w-12 h-12 md:w-14 md:h-14 aspect-square! rounded-lg md:rounded-xl bg-primary dark:bg-primary flex items-center justify-center shadow-2xl border-2 border-primary-300 dark:border-primary-800"
                >
                    <img
                        [src]="
                            isDarkMode() ? 'logo-dark.png' : 'logo-light.png'
                        "
                        alt="Kyrazo"
                        width="48"
                        height="48"
                        loading="lazy"
                        decoding="async"
                        class="w-full h-full p-2 md:p-2.5 object-contain transition-transform duration-300"
                    />

                    <div
                        class="absolute inset-0 rounded-lg md:rounded-xl border border-primary-500 animate-ping opacity-20"
                    ></div>
                </div>

                <!-- Destinations (Right) -->
                <div class="flex flex-col gap-6 md:gap-10 z-20 items-end">
                    <div class="flex items-center gap-3 group">
                        <div
                            class="px-2 md:px-3 py-1 md:py-1.5 rounded-lg md:rounded-xl bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-sm flex items-center gap-2"
                        >
                            <i
                                class="pi pi-database text-primary-500 text-[8px] md:text-[10px]"
                            ></i>
                            <span
                                class="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-surface-900 dark:text-surface-50"
                                >Storage</span
                            >
                        </div>
                    </div>
                    <div class="flex items-center gap-3 group">
                        <div
                            class="px-2 md:px-3 py-1 md:py-1.5 rounded-lg md:rounded-xl bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-sm flex items-center gap-2"
                        >
                            <i
                                class="pi pi-link text-primary-500 text-[8px] md:text-[10px]"
                            ></i>
                            <span
                                class="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-surface-900 dark:text-surface-50"
                                >Endpoint</span
                            >
                        </div>
                    </div>
                </div>
            </div>

            <!-- Background Glow -->
            <div
                class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10"
            >
                <div
                    class="w-32 h-32 bg-primary-500/5 blur-[60px] rounded-full"
                ></div>
            </div>
        </div>
