<section class="py-16 md:py-24 bg-transparent" id="features">
    <div class="px-4 md:px-6 max-w-7xl mx-auto">
        <!-- Core Capabilities Section -->
        <div class="text-center mb-12 md:mb-16" appScrollReveal>
            <span
                class="text-primary-500 font-bold uppercase tracking-[0.2em] text-[10px]! px-3 py-1 bg-primary-500/10 rounded-full border border-primary-500/20">The
                Platform</span>
            <h2 class="text-3xl md:text-5xl font-extrabold mt-6 text-surface-900 dark:text-surface-0 tracking-tight px-4 font-sansation">
                Ingest, Dispatch.
            </h2>
            <p class="mt-4 text-base md:text-lg text-surface-600 dark:text-surface-400 max-w-2xl mx-auto px-6">Everything you need to
                build robust event-driven architectures with speed and reliability.</p>
        </div>
        <!-- Ingest & Dispatch Top Duo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12 max-w-[1400px] mx-auto mb-12 px-2 md:px-0">
            @for (cap of capabilities.slice(0, 2); track cap.title) {
                <div appScrollReveal
                    [delay]="'delay-' + ($index * 200 + 100)" class="group relative transition-all duration-300">
                    <div
                        class="relative p-6 md:p-8 rounded-xl bg-surface-0 dark:bg-surface-950 border border-surface-200 dark:border-surface-900 h-full shadow-xs group-hover:shadow-sm hover:shadow-primary-500/10 overflow-hidden flex flex-col">
                        <!-- Diagram Container -->
                        <div
                            class="relative flex items-center justify-center rounded-xl transition-colors overflow-hidden shrink-0 h-48 md:h-64">
                            <div class="transition-transform w-full duration-700 ease-out">
                                @switch (cap.diagram) {
                                    @case ('ingest') {
                                        <app-ingest-diagram />
                                    }
                                    @case ('dispatch') {
                                        <app-dispatch-diagram />
                                    }
                                }
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="relative z-10 flex flex-col grow">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 mb-6">
                                <h3
                                    class="text-2xl md:text-3xl font-black text-surface-900 dark:text-surface-0 tracking-tight transition-colors leading-tight">
                                    {{ cap.title }}</h3>
                            </div>
                            <p
                                class="text-sm md:text-base text-surface-600 dark:text-surface-400 leading-relaxed font-medium ">
                                {{ cap.description }}</p>
                        </div>

                        <div
                            class="absolute -bottom-16 left-1/2 -translate-x-1/2 w-full h-32 bg-primary-400/5 blur-[90px] rounded-full opacity-100 pointer-events-none"
                        ></div>
                    </div>
                </div>
            }
        </div>
