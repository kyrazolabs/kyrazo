<div class="relative w-full py-16 md:py-28 overflow-hidden bg-surface-950 rounded-2xl md:rounded-[3rem] border border-surface-800 shadow-2xl">
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#3b82f6 0.5px, transparent 0.5px); background-size: 30px 30px;"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 translate-y-2/3 w-[300px] md:w-[600px] h-[100px] md:h-[150px] bg-primary-500/20 blur-[60px] md:blur-[80px] rounded-full pointer-events-none"></div>

    <div class="relative z-10 text-center max-w-3xl mx-auto px-4 md:px-6" appScrollReveal>
        <h2 class="text-3xl md:text-6xl font-black text-white mb-6 md:mb-8 tracking-tighter leading-tight">
            Ready to experience the future of <span class="text-primary-500 text-glow font-sansation!">webhooks?</span>
        </h2>
        <p class="text-lg md:text-xl text-surface-400 mb-8 md:mb-12 font-medium px-2 md:px-0">
            Join thousands of developers who trust Kyrazo handling their critical events.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button [routerLink]="['/auth/register']" (click)="trackCta()" class="px-8 py-1.5 bg-white text-black font-black rounded-xl hover:bg-primary-800 hover:text-white transition-all duration-300 shadow-xl shadow-white/5 cursor-pointer" aria-label="Get early access for Kyrazo">
                Get Early Access
            </button>
            <!-- <button class="px-8 py-2 bg-transparent border-2 border-surface-800 text-white font-black rounded-2xl hover:bg-surface-800 transition-all duration-300">
                Compare Plans
            </button> -->
        </div>
    </div>
</div>
